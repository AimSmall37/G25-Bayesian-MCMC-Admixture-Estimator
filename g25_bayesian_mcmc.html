<script>
// ═══════════════════════════════════════════════════════════════════════════
// TAB / FILE HANDLING
// ═══════════════════════════════════════════════════════════════════════════

function switchTab(which, mode, btn) {
  const parent = btn.parentElement;
  parent.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(which + '-paste').style.display = mode === 'paste' ? '' : 'none';
  document.getElementById(which + '-upload').style.display = mode === 'upload' ? '' : 'none';
}

function handleFile(input, which) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById(which + '-text').value = e.target.result;
    document.getElementById(which + '-drop-label').innerHTML = '<span class="loaded">✓ ' + file.name + ' loaded</span>';
  };
  reader.readAsText(file);
}

// drag-over styling
['source-drop','target-drop'].forEach(id => {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('dragover'); });
  el.addEventListener('dragleave', () => el.classList.remove('dragover'));
  el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('dragover'); });
});


// ═══════════════════════════════════════════════════════════════════════════
// SEEDED PRNG (Mulberry32)
// ═══════════════════════════════════════════════════════════════════════════

function mulberry32(seed) {
  return function() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = t + Math.imul(t ^ (t >>> 7), 61 | t) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

let rand = mulberry32(42);

// Box-Muller for normal samples
function randNormal() {
  let u, v, s;
  do { u = 2 * rand() - 1; v = 2 * rand() - 1; s = u*u + v*v; } while (s >= 1 || s === 0);
  return u * Math.sqrt(-2 * Math.log(s) / s);
}

// Gamma variate (Marsaglia & Tsang)
function randGamma(shape) {
  if (shape < 1) {
    return randGamma(shape + 1) * Math.pow(rand(), 1 / shape);
  }
  const d = shape - 1/3;
  const c = 1 / Math.sqrt(9 * d);
  while (true) {
    let x, v;
    do { x = randNormal(); v = 1 + c * x; } while (v <= 0);
    v = v * v * v;
    const u = rand();
    if (u < 1 - 0.0331 * (x*x) * (x*x)) return d * v;
    if (Math.log(u) < 0.5 * x * x + d * (1 - v + Math.log(v))) return d * v;
  }
}


// ═══════════════════════════════════════════════════════════════════════════
// DATA PARSING
// ═══════════════════════════════════════════════════════════════════════════

function parseG25(text) {
  const lines = text.trim().split('\n').filter(l => l.trim().length > 0);
  const labels = [], populations = [], samples = [], coords = [];
  const debugWarnings = [];
  for (let lineIdx = 0; lineIdx < lines.length; lineIdx++) {
    const line = lines[lineIdx];
    // handle both comma and tab delimiters
    const parts = line.indexOf('\t') >= 0 ? line.split('\t') : line.split(',');
    const label = parts[0].trim();
    const rawVals = parts.slice(1).map(v => v.trim());
    const vals = rawVals.map(v => parseFloat(v));
    
    // Debug: check for NaN values in parsed coordinates
    const nanIndices = [];
    for (let vi = 0; vi < vals.length; vi++) {
      if (isNaN(vals[vi])) nanIndices.push(vi);
    }
    const validVals = vals.filter(v => !isNaN(v));
    
    if (nanIndices.length > 0 && validVals.length >= 2) {
      debugWarnings.push(`  Line ${lineIdx+1} "${label}": ${nanIndices.length} NaN value(s) at column(s) ${nanIndices.map(i=>i+2).join(',')} — raw: [${nanIndices.map(i => '"'+rawVals[i]+'"').join(', ')}]`);
    }
    
    if (validVals.length < 2) {
      if (parts.length > 1) {
        debugWarnings.push(`  Line ${lineIdx+1} "${label}": skipped — only ${validVals.length} valid numeric values (${parts.length-1} columns found)`);
      }
      continue;
    }
    
    // Check for coordinate dimension consistency
    if (coords.length > 0 && validVals.length !== coords[0].length) {
      debugWarnings.push(`  Line ${lineIdx+1} "${label}": WARNING — ${validVals.length} dimensions vs ${coords[0].length} in first row`);
    }
    
    labels.push(label);
    const sp = label.split(':');
    populations.push(sp[0]);
    samples.push(sp.length > 1 ? sp.slice(1).join(':') : sp[0]);
    coords.push(validVals);
  }
  return { labels, populations, samples, coords, debugWarnings };
}


// ═══════════════════════════════════════════════════════════════════════════
// EMPIRICAL NOISE FLOOR (Phase 1)
// ═══════════════════════════════════════════════════════════════════════════
// The scatter of samples around their own population mean measures the
// per-individual noise in G25 space. Pooling it across every population with
// >= 2 samples gives a data-derived noise floor, so sigma need not be guessed.
function estimateNoiseFloor(coords, populations) {
  const D = coords[0].length;
  const ss = new Float64Array(D);
  let df = 0, nMulti = 0;
  const groups = new Map();
  for (let i = 0; i < populations.length; i++) {
    const p = populations[i];
    if (!groups.has(p)) groups.set(p, []);
    groups.get(p).push(i);
  }
  for (const idx of groups.values()) {
    if (idx.length < 2) continue;                 // singletons carry no within-group info
    const mu = new Float64Array(D);
    for (const i of idx) for (let d = 0; d < D; d++) mu[d] += coords[i][d];
    for (let d = 0; d < D; d++) mu[d] /= idx.length;
    for (const i of idx) for (let d = 0; d < D; d++) { const r = coords[i][d] - mu[d]; ss[d] += r*r; }
    df += idx.length - 1;
    nMulti++;
  }
  if (df < 1) return { sigmaScalar: NaN, sigmaD: new Array(D).fill(NaN), df: 0, nMulti: 0 };
  const varD = Array.from(ss, v => v / df);
  const meanVar = varD.reduce((a,b) => a+b, 0) / D;
  return { sigmaScalar: Math.sqrt(meanVar), sigmaD: varD.map(Math.sqrt), df, nMulti };
}

// Propagation factor turning the per-individual floor into this target's residual
// sigma:  sigma_resid = floor * sqrt( 1/m_target + sum_k w_k^2 / n_k )
function propagationFactor(weights, nSamplesPerSource, mTarget) {
  let srcTerm = 0;
  for (let k = 0; k < weights.length; k++) {
    srcTerm += (weights[k] * weights[k]) / Math.max(nSamplesPerSource[k], 1);
  }
  return Math.sqrt(1 / Math.max(mTarget, 1) + srcTerm);
}

function rmsOf(v) { // scalar summary of a scalar-or-array sigma
  if (!Array.isArray(v)) return v;
  let s = 0; for (const x of v) s += x*x; return Math.sqrt(s / v.length);
}


// ═══════════════════════════════════════════════════════════════════════════
// LINEAR ALGEBRA HELPERS
// ═══════════════════════════════════════════════════════════════════════════

function dot(a, b) { let s = 0; for (let i = 0; i < a.length; i++) s += a[i]*b[i]; return s; }
function vecSub(a, b) { return a.map((v,i) => v - b[i]); }
function vecNorm(a) { return Math.sqrt(dot(a, a)); }

// matrix multiply: rows of A by cols of B  (A = array of row arrays)
function matVecMul(mat, vec) {
  return mat.map(row => dot(row, vec));
}

// weighted combination: w (length K) * sourceMat (K rows x D cols) => D-vector
function weightedSum(w, sourceMat) {
  const D = sourceMat[0].length;
  const result = new Float64Array(D);
  for (let k = 0; k < w.length; k++) {
    for (let d = 0; d < D; d++) result[d] += w[k] * sourceMat[k][d];
  }
  return Array.from(result);
}


// ═══════════════════════════════════════════════════════════════════════════
// NNLS SOLVER (coordinate descent, simplex-constrained)
// ═══════════════════════════════════════════════════════════════════════════

function solveNNLS(targetVec, sourceMat, maxIter = 2000, tol = 1e-8) {
  // Gram-free coordinate descent. The original version precomputed the full
  // K x K Gram matrix (StS), which costs O(K^2) time and memory — at
  // K = 20,000 that's a ~3.2 GB array and ~1e12 flops per solve. Since each
  // source only lives in D dimensions (D << K for any realistic G25 panel),
  // we never need StS at all: we keep a running "predicted" vector
  // (predicted = w^T * sourceMat, length D) and update it incrementally as
  // each w_k changes. That reproduces the exact same update rule —
  //   residual_k = Sty[k] - dot(S_k, predicted) + diag[k] * w[k]
  // — because dot(S_k, predicted) = sum_j StS[k][j] * w[j]. Cost per sweep
  // drops from O(K^2) to O(K*D); memory drops from O(K^2) to O(K + D).
  const K = sourceMat.length;
  const D = targetVec.length;

  // Precompute per-source squared norm (diag of what would be StS) and Sty.
  // Both are O(K*D), not O(K^2).
  const diag = new Float64Array(K);
  const Sty  = new Float64Array(K);
  for (let k = 0; k < K; k++) {
    const Sk = sourceMat[k];
    let d = 0, sty = 0;
    for (let i = 0; i < D; i++) {
      d   += Sk[i] * Sk[i];
      sty += Sk[i] * targetVec[i];
    }
    diag[k] = d;
    Sty[k]  = sty;
  }

  const w = new Float64Array(K);
  const predicted = new Float64Array(D); // running w^T * sourceMat

  for (let iter = 0; iter < maxIter; iter++) {
    let maxChange = 0;
    for (let k = 0; k < K; k++) {
      if (diag[k] === 0) continue; // degenerate all-zero source vector
      const Sk = sourceMat[k];

      // dot(S_k, predicted) replaces the StS-row dot product
      let sp = 0;
      for (let i = 0; i < D; i++) sp += Sk[i] * predicted[i];

      const residual_k = Sty[k] - sp + diag[k] * w[k];
      const newVal = Math.max(0, residual_k / diag[k]);
      const delta = newVal - w[k];

      if (delta !== 0) {
        for (let i = 0; i < D; i++) predicted[i] += delta * Sk[i];
      }
      maxChange = Math.max(maxChange, Math.abs(delta));
      w[k] = newVal;
    }
    // Normalise to simplex — rescale predicted by the same factor so it
    // stays consistent with w without recomputing it from scratch.
    let s = 0;
    for (let k = 0; k < K; k++) s += w[k];
    if (s > 0) {
      for (let k = 0; k < K; k++) w[k] /= s;
      for (let i = 0; i < D; i++) predicted[i] /= s;
    }

    if (maxChange < tol) break;
  }
  return Array.from(w);
}


// ═══════════════════════════════════════════════════════════════════════════
// PRE-SELECTION
// ═══════════════════════════════════════════════════════════════════════════

function residualChase(targetVec, sourceMat, nRounds = 12, restrictTo = null) {
  const K = sourceMat.length;
  // Only search within the supplied pool (defaults to all). Essential sources
  // always carry NNLS weight and so are already in the pool; restricting the
  // search here cuts cost ~10x on large panels.
  const pool = restrictTo || [...Array(K).keys()];
  const selected = [];
  let residual = targetVec.slice();

  for (let round = 0; round < nRounds; round++) {
    let bestJ = -1, bestRSS = Infinity;
    for (const j of pool) {
      if (selected.includes(j)) continue;
      const trial = [...selected, j];
      const trialMat = trial.map(i => sourceMat[i]);
      const wTrial = solveNNLS(targetVec, trialMat, 500);
      const pred = weightedSum(wTrial, trialMat);
      const rss = dot(vecSub(targetVec, pred), vecSub(targetVec, pred));
      if (rss < bestRSS) { bestRSS = rss; bestJ = j; }
    }
    if (bestJ < 0 || selected.includes(bestJ)) break;
    selected.push(bestJ);

    const trialMat = selected.map(i => sourceMat[i]);
    const wTrial = solveNNLS(targetVec, trialMat, 500);
    residual = vecSub(targetVec, weightedSum(wTrial, trialMat));
    if (vecNorm(residual) < 1e-6) break;
  }
  return selected;
}

function preselectSources(targetVec, sourceMat, sourceNames, nKeep, log) {
  const K = sourceMat.length;
  log('step', `  Pre-selecting from ${K} sources...`);

  // Method 1: distance
  const dists = sourceMat.map(s => vecNorm(vecSub(targetVec, s)));
  const distOrder = [...Array(K).keys()].sort((a,b) => dists[a]-dists[b]);
  const distTop = distOrder.slice(0, Math.min(nKeep, K));
  log('', `    Distance: ${distTop.length} candidates`);

  // Method 2: NNLS
  const wNNLS = solveNNLS(targetVec, sourceMat, 2000);
  const nnlsActive = [];
  for (let i = 0; i < K; i++) if (wNNLS[i] > 1e-4) nnlsActive.push(i);
  const nnlsOrder = [...Array(K).keys()].sort((a,b) => wNNLS[b]-wNNLS[a]);
  const nnlsTop = nnlsOrder.slice(0, Math.min(nKeep, K));
  const nnlsSet = [...new Set([...nnlsActive, ...nnlsTop])];
  log('', `    NNLS: ${nnlsActive.length} active, ${nnlsSet.length} total`);

  // Method 4: direction (computed before chase so it can join the pool)
  const tNorm = vecNorm(targetVec) + 1e-15;
  const targetUnit = targetVec.map(v => v / tNorm);
  const cosSim = sourceMat.map(s => dot(s, targetUnit) / (vecNorm(s) + 1e-15));
  const dirOrder = [...Array(K).keys()].sort((a,b) => cosSim[b]-cosSim[a]);
  const dirTop = dirOrder.slice(0, Math.min(Math.ceil(nKeep/3), K));

  // Method 3: residual chase, restricted to the pooled candidates (~10x faster)
  const chasePool = [...new Set([...distTop, ...nnlsSet, ...dirTop])];
  log('', `    Residual chase: searching ${chasePool.length} pooled candidates...`);
  const chaseSet = residualChase(targetVec, sourceMat, 12, chasePool);
  log('', `    Residual chase: ${chaseSet.length} candidates`);

  // Combine
  let allCandidates = [...new Set([...nnlsSet, ...chaseSet, ...distTop, ...dirTop])];

  if (allCandidates.length > nKeep) {
    const scores = allCandidates.map(i => wNNLS[i] * 1000 + 1 / (dists[i] + 0.001));
    const scored = allCandidates.map((idx, i) => ({idx, score: scores[i]}));
    scored.sort((a,b) => b.score - a.score);
    allCandidates = scored.slice(0, nKeep).map(s => s.idx);
  }

  log('ok', `  => Pre-selected ${allCandidates.length} candidates`);
  log('', `  Candidates: ${allCandidates.map(i => sourceNames[i]).join(', ')}`);

  const subMat = allCandidates.map(i => sourceMat[i]);
  const subW = solveNNLS(targetVec, subMat, 2000);

  return { indices: allCandidates, initialWeights: subW };
}


// ═══════════════════════════════════════════════════════════════════════════
// FORWARD STEPWISE SELECTION (BIC)
// ═══════════════════════════════════════════════════════════════════════════

function computeBIC(targetVec, sourceMat, w, sigma, kActive) {
  const pred = weightedSum(w, sourceMat);
  const resid = vecSub(targetVec, pred);
  const n = targetVec.length;
  let logLik;
  if (Array.isArray(sigma)) {
    let ss = 0, logdet = 0;
    for (let i = 0; i < n; i++) {
      const r = resid[i] / sigma[i];
      ss += r * r;
      logdet += Math.log(2 * Math.PI * sigma[i] * sigma[i]);
    }
    logLik = -0.5 * logdet - 0.5 * ss;
  } else {
    const rss = dot(resid, resid);
    logLik = -n/2 * Math.log(2 * Math.PI * sigma * sigma) - rss / (2 * sigma * sigma);
  }
  return -2 * logLik + (kActive - 1) * Math.log(n);
}

function forwardSelect(targetVec, sourceMat, sourceNames, sigma, maxK, minK, log) {
  const K = sourceMat.length;
  maxK = Math.min(maxK, K);
  const selected = [];
  let remaining = [...Array(K).keys()];
  let bestBicOverall = Infinity;
  let bestSet = null;
  const bicTrail = [];
  const stepLog = [];

  log('step', `  Forward stepwise (up to K=${maxK})...`);

  for (let step = 0; step < maxK; step++) {
    let bestBicStep = Infinity, bestAdd = -1;

    for (const j of remaining) {
      const trial = [...selected, j];
      const trialMat = trial.map(i => sourceMat[i]);
      const wTrial = solveNNLS(targetVec, trialMat, 1000);
      const bic = computeBIC(targetVec, trialMat, wTrial, sigma, trial.length);
      if (bic < bestBicStep) { bestBicStep = bic; bestAdd = j; }
    }

    selected.push(bestAdd);
    remaining = remaining.filter(r => r !== bestAdd);
    bicTrail.push(bestBicStep);

    const trialMat = selected.map(i => sourceMat[i]);
    const wTrial = solveNNLS(targetVec, trialMat, 1000);
    const pred = weightedSum(wTrial, trialMat);
    const rmse = Math.sqrt(dot(vecSub(targetVec, pred), vecSub(targetVec, pred)) / targetVec.length);

    const line = `K=${(step+1).toString().padStart(2)}  BIC=${bestBicStep.toFixed(2).padStart(9)}  RMSE=${rmse.toFixed(6)}  +${sourceNames[bestAdd]} (${(wTrial[wTrial.length-1]*100).toFixed(1)}%)`;
    stepLog.push(line);
    log('', `    ${line}`);

    if (bestBicStep < bestBicOverall) {
      bestBicOverall = bestBicStep;
      bestSet = selected.slice();
    }

    if (bicTrail.length >= 4) {
      const recent = bicTrail.slice(-3);
      if (recent[1] > recent[0] && recent[2] > recent[1]) {
        log('', `    (BIC increasing, stopping)`);
        stepLog.push('(BIC increasing, stopping)');
        break;
      }
    }
  }

  if (!bestSet || bestSet.length < minK) {
    bestSet = selected.slice(0, Math.min(minK, selected.length));
  }

  log('ok', `  => Selected K=${bestSet.length} sources`);

  const finalMat = bestSet.map(i => sourceMat[i]);
  const finalW = solveNNLS(targetVec, finalMat, 2000);

  return { indices: bestSet, weights: finalW, stepLog };
}


// ═══════════════════════════════════════════════════════════════════════════
// IDENTIFIABILITY CHECK
// ═══════════════════════════════════════════════════════════════════════════
// When two selected sources sit almost on top of each other in G25 space, the
// likelihood cannot tell them apart: any trade-off between them that preserves
// their summed weight fits equally well. The MCMC then returns wide, mutually
// anti-correlated posteriors whose "uncertainty" is really non-identifiability,
// not a statement about total ancestry. Surface that explicitly.
// Criterion is noise-aware and works for any K >= 2. Shifting a mass delta
// between sources i and j changes the prediction by delta*(s_i - s_j), so the
// likelihood constrains that split with an approximate posterior SD of
// sigma / ||s_i - s_j||. When that SD approaches the width of the [0,1] range
// (a uniform on [0,1] has SD ~= 0.29), the split carries essentially no
// information and the reported percentages for those two sources are arbitrary.
function checkNearDuplicates(coords, names, sigma, log, sdThreshold = 0.25) {
  const K = coords.length;
  if (K < 2) return false;

  let flagged = false;
  for (let i = 0; i < K; i++) {
    for (let j = i + 1; j < K; j++) {
      const d = vecNorm(vecSub(coords[i], coords[j]));
      const splitSd = d > 0 ? sigma / d : Infinity;   // approx posterior SD of the i/j split
      if (splitSd > sdThreshold) {
        flagged = true;
        const sdTxt = splitSd > 1 ? '>1.0' : splitSd.toFixed(2);
        log('warn', `⚠ Near-identical sources: "${names[i]}" and "${names[j]}" ` +
          `differ by only ${d.toExponential(2)} in G25 space, comparable to the noise ` +
          `level (sigma=${sigma}). Their split is effectively unidentifiable ` +
          `(implied posterior SD ~${sdTxt} on a 0-1 scale): the individual percentages ` +
          `are arbitrary, though their combined contribution may still be well determined.`);
      }
    }
  }
  return flagged;
}


// ═══════════════════════════════════════════════════════════════════════════
// BAYESIAN MODEL
// ═══════════════════════════════════════════════════════════════════════════

function logLikelihood(w, targetVec, sourceMat, sigma) {
  const pred = weightedSum(w, sourceMat);
  let ss = 0;
  if (Array.isArray(sigma)) {
    // per-dimension noise (heteroscedastic)
    for (let i = 0; i < targetVec.length; i++) {
      const r = (targetVec[i] - pred[i]) / sigma[i];
      ss += r * r;
    }
    return -ss / 2;
  }
  for (let i = 0; i < targetVec.length; i++) {
    const r = targetVec[i] - pred[i];
    ss += r * r;
  }
  return -ss / (2 * sigma * sigma);
}

function logPriorDirichlet(w, alpha) {
  for (let i = 0; i < w.length; i++) if (w[i] <= 0) return -Infinity;
  let s = 0;
  for (let i = 0; i < w.length; i++) s += Math.log(w[i]);
  return (alpha - 1) * s;
}

function logPosterior(w, targetVec, sourceMat, sigma, alpha) {
  const lp = logPriorDirichlet(w, alpha);
  if (!isFinite(lp)) return -Infinity;
  return lp + logLikelihood(w, targetVec, sourceMat, sigma);
}

function proposeDirichlet(wCurrent, concentration) {
  const alphaProp = wCurrent.map(v => Math.max(0.01, concentration * v));
  // Floor each gamma draw to a tiny positive value: with very small shapes,
  // randGamma can underflow to exactly 0, which would make the component 0,
  // send logDirichletDensity / logPriorDirichlet to -Infinity, and force an
  // automatic rejection. Keeping it strictly positive keeps the move evaluable.
  let proposed = alphaProp.map(a => Math.max(randGamma(a), 1e-300));
  const s = proposed.reduce((a,b) => a+b, 0);
  proposed = proposed.map(v => v / s);
  return { w: proposed, alphaUsed: alphaProp };
}

function logDirichletDensity(x, alphaVec) {
  for (let i = 0; i < x.length; i++) if (x[i] <= 0) return -Infinity;
  let s1 = 0, s2 = 0, s3 = 0;
  for (let i = 0; i < x.length; i++) {
    s1 += (alphaVec[i] - 1) * Math.log(x[i]);
    s2 += lgamma(alphaVec[i]);
    s3 += alphaVec[i];
  }
  return s1 - s2 + lgamma(s3);
}

// Log-gamma (Stirling approx + Lanczos for small values)
function lgamma(x) {
  if (x <= 0) return Infinity;
  // Lanczos approximation
  const g = 7;
  const c = [0.99999999999980993,676.5203681218851,-1259.1392167224028,
    771.32342877765313,-176.61502916214059,12.507343278686905,
    -0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
  let xx = x;
  if (xx < 0.5) {
    return Math.log(Math.PI / Math.sin(Math.PI * xx)) - lgamma(1 - xx);
  }
  xx -= 1;
  let a = c[0];
  const t = xx + g + 0.5;
  for (let i = 1; i < g + 2; i++) a += c[i] / (xx + i);
  return 0.5 * Math.log(2 * Math.PI) + (xx + 0.5) * Math.log(t) - t + Math.log(a);
}


// ═══════════════════════════════════════════════════════════════════════════
// MCMC SAMPLER
// ═══════════════════════════════════════════════════════════════════════════

function runMCMC(targetVec, sourceMat, sourceNames, nIter, burnin, thin, sigma, alpha, initConc, log, progressCb,
                 sampleSigma = false, sigmaPriorStrength = null) {
  const K = sourceMat.length;
  const D = targetVec.length;

  // ── Preallocated, reused buffers ──
  // The original version allocated several small arrays (proposal weights,
  // alpha vectors, predicted vector) EVERY iteration via .map()/weightedSum().
  // At up to 500,000 iterations that's millions of short-lived array
  // allocations feeding the garbage collector on top of the actual math. None
  // of that is necessary: every buffer below is written into in place and
  // reused for the life of the chain. wCurrent/wProposed are swapped by
  // reference on acceptance instead of copied. The sequence of random draws
  // (K gamma draws per proposal, then 1 uniform accept draw, then optionally
  // 1 more gamma draw for sigma) is kept in exactly the same order as before,
  // so for the same seed this produces a bit-identical chain — this is a
  // pure performance change, not a behavioural one.
  let wCurrent  = new Float64Array(K).fill(1 / K);
  let wProposed = new Float64Array(K);
  const alphaFwd = new Float64Array(K);
  const alphaRev = new Float64Array(K);
  const predBuf  = new Float64Array(D);

  const sigmaHetero  = Array.isArray(sigma);
  const sigmaBaseArr = sigmaHetero ? Float64Array.from(sigma) : null;
  const sigmaCurArr  = sigmaHetero ? Float64Array.from(sigma) : null;
  let sigmaCurScalar = sigmaHetero ? null : sigma;

  const nSave = Math.floor((nIter - burnin) / thin);
  const chain = [];
  const logPostTrace = new Float64Array(nIter);
  let acceptCount = 0;
  let acceptSinceAdapt = 0;
  const adaptWindow = 500;
  let conc = (initConc && initConc >= 2) ? initConc : 30;

  // `sigma` is the BASE noise level (scalar or per-dimension array). In bayes
  // mode we sample a single scale k on top of it (effective sigma = k * base),
  // with an Inverse-Gamma prior on k^2 centred at 1 (on the empirical floor).
  const rmsBase = rmsOf(sigma);
  const nu0 = (sigmaPriorStrength && sigmaPriorStrength > 0) ? sigmaPriorStrength : D;
  const a0 = nu0/2 + 1, b0 = nu0/2;
  let k2 = 1;
  const sigmaSamples = sampleSigma ? [] : null;

  // predBuf[d] = sum_k w[k] * sourceMat[k][d] — same accumulation order as
  // the original weightedSum(), so results match bit-for-bit.
  function computePredicted(w) {
    predBuf.fill(0);
    for (let k = 0; k < K; k++) {
      const wk = w[k];
      if (wk === 0) continue;
      const Sk = sourceMat[k];
      for (let d = 0; d < D; d++) predBuf[d] += wk * Sk[d];
    }
  }

  function logLikelihoodFromPred(sigmaArrOrScalar) {
    let ss = 0;
    if (sigmaHetero) {
      for (let d = 0; d < D; d++) {
        const r = (targetVec[d] - predBuf[d]) / sigmaArrOrScalar[d];
        ss += r * r;
      }
      return -ss / 2;
    }
    for (let d = 0; d < D; d++) {
      const r = targetVec[d] - predBuf[d];
      ss += r * r;
    }
    return -ss / (2 * sigmaArrOrScalar * sigmaArrOrScalar);
  }

  function logPriorDirichletArr(w) {
    let s = 0;
    for (let k = 0; k < K; k++) {
      if (w[k] <= 0) return -Infinity;
      s += Math.log(w[k]);
    }
    return (alpha - 1) * s;
  }

  function logPosteriorArr(w, sigmaArrOrScalar) {
    const lp = logPriorDirichletArr(w);
    if (!isFinite(lp)) return -Infinity;
    computePredicted(w);
    return lp + logLikelihoodFromPred(sigmaArrOrScalar);
  }

  function logDirichletDensityArr(x, alphaVec) {
    let s1 = 0, s2 = 0, s3 = 0;
    for (let k = 0; k < K; k++) {
      if (x[k] <= 0) return -Infinity;
      s1 += (alphaVec[k] - 1) * Math.log(x[k]);
      s2 += lgamma(alphaVec[k]);
      s3 += alphaVec[k];
    }
    return s1 - s2 + lgamma(s3);
  }

  let lpCurrent = logPosteriorArr(wCurrent, sigmaHetero ? sigmaCurArr : sigmaCurScalar);

  log('step', `  MCMC: ${nIter} iterations (burn-in: ${burnin}, thin: ${thin})${sampleSigma ? ' [sampling sigma]' : ''}`);

  for (let i = 0; i < nIter; i++) {
    // Propose: Dirichlet centred on wCurrent. alphaFwd[k] only depends on
    // wCurrent[k], so computing it and drawing its gamma variate in the same
    // pass (rather than in two separate .map() sweeps like the original)
    // draws randGamma(alpha[0]), randGamma(alpha[1]), ... in the exact same
    // order as before.
    let sSum = 0;
    for (let k = 0; k < K; k++) {
      const a = Math.max(0.01, conc * wCurrent[k]);
      alphaFwd[k] = a;
      const g = Math.max(randGamma(a), 1e-300);
      wProposed[k] = g;
      sSum += g;
    }
    for (let k = 0; k < K; k++) wProposed[k] /= sSum;

    const sigmaForEval = sigmaHetero ? sigmaCurArr : sigmaCurScalar;
    const lpProposed = logPosteriorArr(wProposed, sigmaForEval);

    for (let k = 0; k < K; k++) alphaRev[k] = Math.max(0.01, conc * wProposed[k]);
    const logQFwd = logDirichletDensityArr(wProposed, alphaFwd);
    const logQRev = logDirichletDensityArr(wCurrent, alphaRev);

    const logAlphaMH = (lpProposed - lpCurrent) + (logQRev - logQFwd);

    if (Math.log(rand()) < logAlphaMH) {
      // Swap buffer references instead of copying — wProposed's contents
      // become the new wCurrent, and the old wCurrent buffer is reused as
      // scratch space (fully overwritten) on the next proposal.
      const tmp = wCurrent; wCurrent = wProposed; wProposed = tmp;
      lpCurrent = lpProposed;
      acceptCount++;
      acceptSinceAdapt++;
    }

    // Gibbs update of the noise scale (bayes mode). Conjugate Inverse-Gamma.
    if (sampleSigma) {
      computePredicted(wCurrent);
      let uSS = 0;
      if (sigmaHetero) {
        for (let d = 0; d < D; d++) { const r = (targetVec[d]-predBuf[d]) / sigmaBaseArr[d]; uSS += r*r; }
      } else {
        for (let d = 0; d < D; d++) { const r = targetVec[d]-predBuf[d]; uSS += r*r; } uSS /= (sigma*sigma);
      }
      k2 = (b0 + uSS/2) / Math.max(randGamma(a0 + D/2), 1e-300);   // 1/Gamma(A,rate=B)
      const kScale = Math.sqrt(k2);
      if (sigmaHetero) {
        for (let d = 0; d < D; d++) sigmaCurArr[d] = sigmaBaseArr[d] * kScale;
      } else {
        sigmaCurScalar = sigma * kScale;
      }
      lpCurrent = logPosteriorArr(wCurrent, sigmaHetero ? sigmaCurArr : sigmaCurScalar);
    }

    logPostTrace[i] = lpCurrent;

    if (i >= burnin && ((i - burnin) % thin === 0)) {
      chain.push(Array.from(wCurrent)); // snapshot copy — wCurrent's buffer keeps getting reused
      if (sampleSigma) sigmaSamples.push(Math.sqrt(k2) * rmsBase);
    }

    // Adaptive proposal during burn-in (windowed rate; runs opposite to accept).
    if (i < burnin && i > 0 && i % adaptWindow === 0) {
      const windowRate = acceptSinceAdapt / adaptWindow;
      if (windowRate > 0.50) conc *= 0.8;
      else if (windowRate < 0.20) conc *= 1.2;
      conc = Math.max(2, Math.min(conc, 5000));
      acceptSinceAdapt = 0;
    }

    if (i % 5000 === 0) {
      progressCb((i / nIter) * 100);
      let msg = `    Iter ${i}/${nIter} | Accept: ${(acceptCount/(i+1)).toFixed(3)} | Conc: ${conc.toFixed(0)}`;
      if (sampleSigma) msg += ` | Sigma: ${(Math.sqrt(k2)*rmsBase).toFixed(5)}`;
      log('iter', msg);
    }
  }

  progressCb(100);
  const acceptRate = acceptCount / nIter;
  log('ok', `  Final acceptance rate: ${acceptRate.toFixed(3)}`);

  let sigmaPosterior = null;
  if (sampleSigma && sigmaSamples.length > 0) {
    const sorted = sigmaSamples.slice().sort((a,b) => a-b);
    const q = p => sorted[Math.min(sorted.length-1, Math.floor(p*sorted.length))];
    sigmaPosterior = {
      mean: sigmaSamples.reduce((a,b)=>a+b,0) / sigmaSamples.length,
      ciLo: q(0.025), ciHi: q(0.975)
    };
    log('ok', `  Posterior sigma: ${sigmaPosterior.mean.toFixed(5)} [${sigmaPosterior.ciLo.toFixed(5)} - ${sigmaPosterior.ciHi.toFixed(5)}]`);
  }

  return { chain, logPostTrace: Array.from(logPostTrace), acceptanceRate: acceptRate,
           finalConcentration: conc, sigmaPosterior };
}


// ═══════════════════════════════════════════════════════════════════════════
// POSTERIOR SUMMARY
// ═══════════════════════════════════════════════════════════════════════════

function summarisePosterior(chain, sourceNames, threshold = 0.005) {
  const K = sourceNames.length;
  const N = chain.length;
  const results = [];

  if (N === 0) {
    // Return NaN-safe defaults when chain is empty
    for (let k = 0; k < K; k++) {
      results.push({
        source: sourceNames[k],
        mean: 0, median: 0, sd: 0, ciLo: 0, ciHi: 0,
        pctMean: 0, pctCILo: 0, pctCIHi: 0,
        significant: false
      });
    }
    return results;
  }

  for (let k = 0; k < K; k++) {
    const vals = chain.map(row => row[k]);
    vals.sort((a,b) => a-b);
    const mean = vals.reduce((a,b) => a+b, 0) / N;
    const median = vals[Math.floor(N/2)];
    const sd = Math.sqrt(vals.reduce((s,v) => s + (v-mean)*(v-mean), 0) / N);
    const ciLo = vals[Math.max(0, Math.floor(N * 0.025))];
    const ciHi = vals[Math.min(N - 1, Math.floor(N * 0.975))];

    results.push({
      source: sourceNames[k],
      mean, median, sd, ciLo, ciHi,
      pctMean: mean * 100,
      pctCILo: ciLo * 100,
      pctCIHi: ciHi * 100,
      significant: ciLo > threshold
    });
  }

  results.sort((a,b) => b.mean - a.mean);
  return results;
}


// ═══════════════════════════════════════════════════════════════════════════
// DIAGNOSTICS
// ═══════════════════════════════════════════════════════════════════════════

// In-place iterative Cooley-Tukey FFT (radix-2). re/im are length 2^k.
function fftInPlace(re, im, inverse) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { const tr = re[i]; re[i] = re[j]; re[j] = tr;
                 const ti = im[i]; im[i] = im[j]; im[j] = ti; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = 2 * Math.PI / len * (inverse ? 1 : -1);
    const wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let cwr = 1, cwi = 0;
      for (let k = 0; k < len / 2; k++) {
        const a = i + k, b = i + k + len / 2;
        const vr = re[b] * cwr - im[b] * cwi;
        const vi = re[b] * cwi + im[b] * cwr;
        re[b] = re[a] - vr; im[b] = im[a] - vi;
        re[a] = re[a] + vr; im[a] = im[a] + vi;
        const ncwr = cwr * wr - cwi * wi;
        cwi = cwr * wi + cwi * wr; cwr = ncwr;
      }
    }
  }
  if (inverse) for (let i = 0; i < n; i++) { re[i] /= n; im[i] /= n; }
}

function effectiveSampleSize(x) {
  const n = x.length;
  if (n < 10) return n;
  const mean = x.reduce((a,b) => a+b, 0) / n;
  const centered = x.map(v => v - mean);
  const varX = centered.reduce((s,v) => s + v*v, 0) / n;
  if (varX === 0) return n;

  const maxLag = Math.min(n - 1, Math.floor(n / 2));

  // Autocovariances via FFT: zero-pad to a power of two >= 2n so the circular
  // autocovariance equals the linear one. O(n log n) instead of O(n^2), with
  // numerically identical acf values. acf[lag] = C(lag)/C(0).
  let m = 1; while (m < 2 * n) m <<= 1;
  const re = new Float64Array(m), im = new Float64Array(m);
  for (let i = 0; i < n; i++) re[i] = centered[i];
  fftInPlace(re, im, false);
  for (let i = 0; i < m; i++) { re[i] = re[i]*re[i] + im[i]*im[i]; im[i] = 0; }
  fftInPlace(re, im, true);
  const c0 = re[0];
  const acf = new Array(maxLag + 1);
  for (let lag = 0; lag <= maxLag; lag++) acf[lag] = re[lag] / c0;

  let tau = 1, k = 1;
  while (k + 1 <= maxLag) {
    const pairSum = acf[k] + acf[k + 1];
    if (pairSum < 0) break;
    tau += 2 * pairSum;
    k += 2;
  }
  return Math.max(1, Math.floor(n / tau));
}

function gewekeZ(x) {
  const n = x.length;
  const n1 = Math.floor(n * 0.1);
  const n2 = Math.floor(n * 0.5);
  const x1 = x.slice(0, n1);
  const x2 = x.slice(n - n2);
  const m1 = x1.reduce((a,b) => a+b, 0) / n1;
  const m2 = x2.reduce((a,b) => a+b, 0) / n2;
  const v1 = x1.reduce((s,v) => s+(v-m1)*(v-m1), 0) / n1;
  const v2 = x2.reduce((s,v) => s+(v-m2)*(v-m2), 0) / n2;
  const ess1 = Math.max(1, effectiveSampleSize(x1));
  const ess2 = Math.max(1, effectiveSampleSize(x2));
  const denom = Math.sqrt(v1/ess1 + v2/ess2);
  if (denom === 0) return 0;
  return (m1 - m2) / denom;
}


// ═══════════════════════════════════════════════════════════════════════════
// LOGGING
// ═══════════════════════════════════════════════════════════════════════════

const logEl = document.getElementById('log-panel');
const logToolbarEl = document.getElementById('log-toolbar');

function log(type, msg) {
  logEl.classList.add('visible');
  logToolbarEl.classList.add('visible');
  const cls = type === 'header' ? 'log-header' : type === 'step' ? 'log-step' :
              type === 'ok' ? 'log-ok' : type === 'warn' ? 'log-warn' :
              type === 'err' ? 'log-err' : type === 'iter' ? 'log-iter' : '';
  logEl.innerHTML += `<div class="${cls}">${escHtml(msg)}</div>`;
  logEl.scrollTop = logEl.scrollHeight;
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Instantly shows/hides every "Iter N/M | Accept: ..." line already in the
// log (not just future ones) by toggling a class on the log panel — CSS
// does the actual hide/show, so this works no matter when the checkbox is
// flipped, including mid-run or after the run has finished.
function toggleIterDetailsVisibility(cb) {
  document.getElementById('log-panel').classList.toggle('hide-iter', !cb.checked);
}

function flashBtn(btn, text) {
  if (!btn) return;
  const orig = btn.textContent;
  btn.textContent = text;
  btn.disabled = true;
  setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 1300);
}

// Robust clipboard copy. navigator.clipboard.writeText is only available in
// secure contexts (https, or a real localhost server) — opening this file
// directly (file://) or viewing it in some sandboxed/embedded contexts means
// navigator.clipboard can be undefined entirely, which throws synchronously
// and skips the .then()/.catch() below, so the button silently does nothing.
// This wraps that path in a try/catch and falls back to a hidden-textarea +
// document.execCommand('copy'), which works in those situations too.
function copyToClipboard(text, btn) {
  if (!text || !text.trim()) return;

  function legacyCopy() {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.left = '-1000px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    if (ok) flashBtn(btn, 'Copied ✓');
    else flashBtn(btn, 'Copy failed');
  }

  try {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(() => {
        flashBtn(btn, 'Copied ✓');
      }).catch(() => {
        legacyCopy();
      });
    } else {
      legacyCopy();
    }
  } catch (e) {
    legacyCopy();
  }
}

function copyLog(btn) {
  copyToClipboard(logEl.innerText, btn);
}

function saveLog(btn) {
  const text = logEl.innerText;
  if (!text.trim()) return;
  const blob = new Blob([text], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  const a = document.createElement('a');
  a.href = url;
  a.download = `g25_mcmc_log_${ts}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  flashBtn(btn, 'Saved ✓');
}


// ═══════════════════════════════════════════════════════════════════════════
// CHARTING (Canvas 2D)
// ═══════════════════════════════════════════════════════════════════════════

const CHART_COLORS = ['#5b8af5','#f87171','#4ade80','#fb923c','#a78bfa',
  '#f472b6','#22d3ee','#fbbf24','#94a3b8','#e879f9',
  '#34d399','#f97316','#818cf8','#fb7185','#a3e635'];

function drawBarChart(canvas, summary, targetLabel) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  const items = summary.filter(s => s.pctMean > 0.3);
  const n = items.length;
  if (n === 0) return;

  const padL = 10, padR = 20, padT = 10, padB = 30;
  const barH = Math.min(35, (H - padT - padB) / n - 6);
  const chartW = W - padL - padR;

  ctx.fillStyle = '#0c0e12';
  ctx.fillRect(0, 0, W, H);

  for (let i = 0; i < n; i++) {
    const item = items[i];
    const y = padT + i * (barH + 6);
    const barW = (item.pctMean / 100) * chartW;
    const col = CHART_COLORS[i % CHART_COLORS.length];

    // CI bar (faded)
    const ciL = (item.pctCILo / 100) * chartW;
    const ciR = (item.pctCIHi / 100) * chartW;
    ctx.fillStyle = col + '30';
    ctx.fillRect(padL + ciL, y + barH * 0.3, ciR - ciL, barH * 0.4);

    // Main bar
    ctx.fillStyle = col;
    ctx.beginPath();
    roundRect(ctx, padL, y, barW, barH, 4);
    ctx.fill();

    // Label
    ctx.font = '600 12px "DM Sans"';
    const label = `${item.source}  ${item.pctMean.toFixed(1)}%`;
    const ciLabel = `[${item.pctCILo.toFixed(1)}% – ${item.pctCIHi.toFixed(1)}%]`;

    if (item.pctMean > 25) {
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'left';
      ctx.fillText(label, padL + 8, y + barH/2 + 1);
      ctx.font = '400 10px "JetBrains Mono"';
      ctx.fillStyle = '#ffffff99';
      ctx.fillText(ciLabel, padL + 8, y + barH/2 + 14);
    } else {
      ctx.fillStyle = col;
      ctx.textAlign = 'left';
      ctx.fillText(label, padL + barW + 6, y + barH/2 + 1);
      ctx.font = '400 10px "JetBrains Mono"';
      ctx.fillStyle = '#6b7080';
      ctx.fillText(ciLabel, padL + barW + 6, y + barH/2 + 14);
    }
  }

  // X axis
  ctx.strokeStyle = '#2a2f3a';
  ctx.lineWidth = 1;
  for (let p = 0; p <= 100; p += 20) {
    const x = padL + (p / 100) * chartW;
    ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + n * (barH + 6)); ctx.stroke();
    ctx.fillStyle = '#6b7080';
    ctx.font = '400 10px "JetBrains Mono"';
    ctx.textAlign = 'center';
    ctx.fillText(p + '%', x, H - 8);
  }
}

function drawDensityPlot(canvas, chain, sourceIdx, sourceName, color) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  ctx.fillStyle = '#0c0e12';
  ctx.fillRect(0, 0, W, H);

  const vals = chain.map(row => row[sourceIdx] * 100);
  vals.sort((a,b) => a-b);

  // KDE
  const n = vals.length;
  const mean = vals.reduce((a,b) => a+b,0) / n;
  const sd = Math.sqrt(vals.reduce((s,v) => s+(v-mean)*(v-mean),0)/n);
  const bw = 1.06 * sd * Math.pow(n, -0.2) * 1.2;
  if (bw === 0 || isNaN(bw)) return;

  const xMin = Math.max(0, vals[0] - 3*bw);
  const xMax = Math.min(100, vals[n-1] + 3*bw);
  const steps = 200;
  const dx = (xMax - xMin) / steps;
  const density = [];
  let maxD = 0;

  for (let i = 0; i <= steps; i++) {
    const x = xMin + i * dx;
    let d = 0;
    for (let j = 0; j < n; j++) {
      const z = (x - vals[j]) / bw;
      d += Math.exp(-0.5 * z * z);
    }
    d /= (n * bw * Math.sqrt(2 * Math.PI));
    density.push({x, d});
    if (d > maxD) maxD = d;
  }

  const padL = 50, padR = 20, padT = 30, padB = 40;
  const cW = W - padL - padR, cH = H - padT - padB;

  const toX = x => padL + ((x - xMin) / (xMax - xMin)) * cW;
  const toY = d => padT + cH - (d / maxD) * cH;

  // Fill
  ctx.beginPath();
  ctx.moveTo(toX(density[0].x), toY(0));
  for (const pt of density) ctx.lineTo(toX(pt.x), toY(pt.d));
  ctx.lineTo(toX(density[density.length-1].x), toY(0));
  ctx.closePath();
  ctx.fillStyle = color + '35';
  ctx.fill();

  // Line
  ctx.beginPath();
  for (let i = 0; i < density.length; i++) {
    const fn = i === 0 ? 'moveTo' : 'lineTo';
    ctx[fn](toX(density[i].x), toY(density[i].d));
  }
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.stroke();

  // Mean line
  ctx.setLineDash([5,3]);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(toX(mean), padT); ctx.lineTo(toX(mean), padT + cH); ctx.stroke();
  ctx.setLineDash([]);

  // CI lines
  const ci025 = vals[Math.floor(n * 0.025)];
  const ci975 = vals[Math.floor(n * 0.975)];
  ctx.setLineDash([3,3]);
  ctx.strokeStyle = '#6b7080';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(toX(ci025), padT); ctx.lineTo(toX(ci025), padT + cH); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(toX(ci975), padT); ctx.lineTo(toX(ci975), padT + cH); ctx.stroke();
  ctx.setLineDash([]);

  // Labels
  ctx.fillStyle = color;
  ctx.font = '600 12px "DM Sans"';
  ctx.textAlign = 'left';
  ctx.fillText(`${sourceName}`, padL, 18);
  ctx.font = '500 11px "JetBrains Mono"';
  ctx.fillText(`Mean: ${mean.toFixed(1)}%`, toX(mean) + 6, padT + 16);

  ctx.fillStyle = '#6b7080';
  ctx.font = '400 10px "JetBrains Mono"';
  ctx.textAlign = 'center';
  ctx.fillText(`${ci025.toFixed(1)}%`, toX(ci025), padT + cH + 16);
  ctx.fillText(`${ci975.toFixed(1)}%`, toX(ci975), padT + cH + 16);

  // Axes
  ctx.strokeStyle = '#2a2f3a';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padL, padT + cH); ctx.lineTo(padL + cW, padT + cH); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + cH); ctx.stroke();

  // Y axis label
  ctx.save();
  ctx.fillStyle = '#6b7080';
  ctx.font = '400 10px "JetBrains Mono"';
  ctx.translate(14, padT + cH/2);
  ctx.rotate(-Math.PI/2);
  ctx.textAlign = 'center';
  ctx.fillText('Density', 0, 0);
  ctx.restore();
}

function drawTracePlot(canvas, chain, sourceIdx, sourceName, color) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  ctx.fillStyle = '#0c0e12';
  ctx.fillRect(0, 0, W, H);

  const vals = chain.map(row => row[sourceIdx] * 100);
  const n = vals.length;
  const mean = vals.reduce((a,b) => a+b,0) / n;
  let min = Infinity, max = -Infinity;
  for (const v of vals) { if (v < min) min = v; if (v > max) max = v; }
  const range = max - min || 1;

  const padL = 50, padR = 20, padT = 25, padB = 30;
  const cW = W - padL - padR, cH = H - padT - padB;

  // Trace line
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const x = padL + (i / (n-1)) * cW;
    const y = padT + cH - ((vals[i] - min) / range) * cH;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.strokeStyle = color + '60';
  ctx.lineWidth = 0.8;
  ctx.stroke();

  // Mean line
  const meanY = padT + cH - ((mean - min) / range) * cH;
  ctx.setLineDash([5,3]);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padL, meanY); ctx.lineTo(padL + cW, meanY); ctx.stroke();
  ctx.setLineDash([]);

  // Title
  ctx.fillStyle = color;
  ctx.font = '600 11px "DM Sans"';
  ctx.textAlign = 'left';
  ctx.fillText(sourceName, padL, 16);

  // Axes
  ctx.strokeStyle = '#2a2f3a';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padL, padT + cH); ctx.lineTo(padL + cW, padT + cH); ctx.stroke();

  ctx.fillStyle = '#6b7080';
  ctx.font = '400 9px "JetBrains Mono"';
  ctx.textAlign = 'right';
  ctx.fillText(max.toFixed(1) + '%', padL - 4, padT + 4);
  ctx.fillText(min.toFixed(1) + '%', padL - 4, padT + cH + 4);
}

function drawLogPosteriorTrace(canvas, trace, burnin) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  ctx.fillStyle = '#0c0e12';
  ctx.fillRect(0, 0, W, H);

  const n = trace.length;
  // subsample for performance
  const step = Math.max(1, Math.floor(n / 2000));
  const sub = [];
  for (let i = 0; i < n; i += step) sub.push({ i, v: trace[i] });

  let min = Infinity, max = -Infinity;
  for (const p of sub) {
    if (isFinite(p.v)) {
      if (p.v < min) min = p.v;
      if (p.v > max) max = p.v;
    }
  }
  const range = max - min || 1;

  const padL = 60, padR = 20, padT = 25, padB = 30;
  const cW = W - padL - padR, cH = H - padT - padB;

  ctx.beginPath();
  let started = false;
  for (const p of sub) {
    if (!isFinite(p.v)) continue;
    const x = padL + (p.i / (n-1)) * cW;
    const y = padT + cH - ((p.v - min) / range) * cH;
    if (!started) { ctx.moveTo(x, y); started = true; }
    else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = '#f8717160';
  ctx.lineWidth = 0.8;
  ctx.stroke();

  // Burn-in line
  if (burnin > 0 && burnin < n) {
    const bx = padL + (burnin / (n-1)) * cW;
    ctx.setLineDash([5,3]);
    ctx.strokeStyle = '#5b8af5';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(bx, padT); ctx.lineTo(bx, padT + cH); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#5b8af5';
    ctx.font = '400 10px "JetBrains Mono"';
    ctx.textAlign = 'left';
    ctx.fillText(`burn-in = ${burnin}`, bx + 4, padT + 14);
  }

  // Axes
  ctx.strokeStyle = '#2a2f3a';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padL, padT + cH); ctx.lineTo(padL + cW, padT + cH); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + cH); ctx.stroke();

  ctx.fillStyle = '#6b7080';
  ctx.font = '400 9px "JetBrains Mono"';
  ctx.textAlign = 'right';
  ctx.fillText(max.toFixed(1), padL - 4, padT + 4);
  ctx.fillText(min.toFixed(1), padL - 4, padT + cH + 4);
  ctx.textAlign = 'center';
  ctx.fillText('Iteration', padL + cW/2, H - 4);

  ctx.fillStyle = '#f87171';
  ctx.font = '600 11px "DM Sans"';
  ctx.textAlign = 'left';
  ctx.fillText('Log-Posterior Trace', padL, 16);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}


// ═══════════════════════════════════════════════════════════════════════════
// COMPARISON MATRIX (multi-target, Vahaduo-style)
// ═══════════════════════════════════════════════════════════════════════════

let MATRIX_STATE = null; // { sourceCols, rows: [{label,distance,values[]}], avgValues, avgDistance, originalOrder }

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}

function lerpColor(c1, c2, t) {
  const p1 = hexToRgb(c1), p2 = hexToRgb(c2);
  const r = Math.round(p1.r + (p2.r - p1.r) * t);
  const g = Math.round(p1.g + (p2.g - p1.g) * t);
  const b = Math.round(p1.b + (p2.b - p1.b) * t);
  return `rgb(${r},${g},${b})`;
}

// Maps a 0-100 percentage to a dark-slate -> accent-blue -> cyan heat color,
// saturating around 55% so low-magnitude "noise" sources stay muted and the
// dominant components pop, similar to Vahaduo's auto distance coloring.
function heatColor(value) {
  const t = Math.max(0, Math.min(1, value / 55));
  if (t < 0.55) return lerpColor('#2a2e38', '#3d6de0', t / 0.55);
  return lerpColor('#3d6de0', '#5be0e0', (t - 0.55) / 0.45);
}

function buildMatrixData(allTargetSummaries) {
  const sourceSet = new Set();
  for (const t of allTargetSummaries) for (const s of t.sources) sourceSet.add(s.name);
  const sourceCols = [...sourceSet].sort((a, b) => a.localeCompare(b));

  const rows = allTargetSummaries.map(t => {
    const map = new Map(t.sources.map(s => [s.name, s.pct]));
    return {
      label: t.label,
      distance: t.distance,
      values: sourceCols.map(c => map.get(c) || 0)
    };
  });

  const avgValues = sourceCols.map((_, ci) =>
    rows.reduce((sum, r) => sum + r.values[ci], 0) / rows.length);
  const validDist = rows.map(r => r.distance).filter(d => !isNaN(d));
  const avgDistance = validDist.length ? validDist.reduce((a, b) => a + b, 0) / validDist.length : NaN;

  return { sourceCols, rows, avgValues, avgDistance, originalOrder: rows.map(r => r.label) };
}

function renderMatrixSection(allTargetSummaries) {
  MATRIX_STATE = buildMatrixData(allTargetSummaries);

  const resultsSection = document.getElementById('results-section');
  let html = `<div class="matrix-section" id="matrix-section">
    <div class="results-header">Comparison Matrix — All Targets</div>
    <p class="matrix-help">Click a source column to sort every target by that population's %, highest first. Click <b>Distance</b> to sort by best overall fit (lowest first). <b>Reset Sorting</b> restores the original target order. The bottom <b>Average</b> row is the mean across all targets. Cell shading scales with the %.</p>
    <div class="matrix-toolbar">
      <button class="matrix-btn" onclick="resetMatrixSort()">Reset Sorting</button>
      <div class="spacer"></div>
      <button class="matrix-btn" onclick="copyMatrixAs('csv', this)">Copy Table as CSV</button>
      <button class="matrix-btn" onclick="copyMatrixAs('tsv', this)">Copy Table as TSV</button>
      <button class="matrix-btn" onclick="downloadMatrixImage(this)">Save as Image</button>
    </div>
    <div class="matrix-wrap" id="matrix-wrap"></div>
  </div>`;
  resultsSection.insertAdjacentHTML('beforeend', html);
  drawMatrixTable();
}

// Escapes a label and inserts an invisible wrap opportunity right after each
// underscore, so long population names ("Denmark_Jutland_Germanic_IA") wrap
// onto new lines at underscore boundaries instead of overflowing or getting
// broken mid-word.
function wrapLabelHtml(label) {
  return escHtml(label).replace(/_/g, '_\u200B');
}

function drawMatrixTable() {
  const st = MATRIX_STATE;
  if (!st) return;
  const wrap = document.getElementById('matrix-wrap');

  let html = '<table class="matrix-table"><thead><tr>';
  html += `<th class="matrix-rowhead">Target</th>`;
  html += `<th class="matrix-dist" onclick="sortMatrixBy('__distance__')">Distance</th>`;
  for (const c of st.sourceCols) {
    const safe = c.replace(/'/g, "\\'");
    html += `<th class="matrix-colname" onclick="sortMatrixBy('${safe}')" title="${escHtml(c)}">${wrapLabelHtml(c)}</th>`;
  }
  html += '</tr></thead><tbody>';

  for (const row of st.rows) {
    html += '<tr>';
    html += `<td class="matrix-rowhead">${escHtml(row.label)}</td>`;
    html += `<td class="matrix-dist">${isNaN(row.distance) ? 'N/A' : row.distance.toFixed(6)}</td>`;
    for (const v of row.values) {
      html += `<td class="matrix-colcell" style="background:${heatColor(v)}">${v.toFixed(1)}</td>`;
    }
    html += '</tr>';
  }

  // Average row
  html += '<tr class="matrix-avg-row">';
  html += `<td class="matrix-rowhead">Average</td>`;
  html += `<td class="matrix-dist">${isNaN(st.avgDistance) ? 'N/A' : st.avgDistance.toFixed(6)}</td>`;
  for (const v of st.avgValues) {
    html += `<td class="matrix-colcell" style="background:${heatColor(v)}">${v.toFixed(1)}</td>`;
  }
  html += '</tr>';

  html += '</tbody></table>';
  wrap.innerHTML = html;
}

function sortMatrixBy(col) {
  const st = MATRIX_STATE;
  if (!st) return;
  if (col === '__distance__') {
    st.rows.sort((a, b) => a.distance - b.distance); // best (lowest distance) fit first
  } else {
    const ci = st.sourceCols.indexOf(col);
    if (ci === -1) return;
    st.rows.sort((a, b) => b.values[ci] - a.values[ci]); // highest % first
  }
  drawMatrixTable();
}

function resetMatrixSort() {
  const st = MATRIX_STATE;
  if (!st) return;
  const order = new Map(st.originalOrder.map((label, i) => [label, i]));
  st.rows.sort((a, b) => order.get(a.label) - order.get(b.label));
  drawMatrixTable();
}

function matrixToDelimited(delim) {
  const st = MATRIX_STATE;
  if (!st) return '';
  const lines = [];
  lines.push(['Target', 'Distance', ...st.sourceCols].join(delim));
  for (const row of st.rows) {
    lines.push([row.label, isNaN(row.distance) ? '' : row.distance.toFixed(6),
                ...row.values.map(v => v.toFixed(1))].join(delim));
  }
  lines.push(['Average', isNaN(st.avgDistance) ? '' : st.avgDistance.toFixed(6),
              ...st.avgValues.map(v => v.toFixed(1))].join(delim));
  return lines.join('\n');
}

function copyMatrixAs(kind, btn) {
  const delim = kind === 'tsv' ? '\t' : ',';
  const text = matrixToDelimited(delim);
  if (!text) return;
  copyToClipboard(text, btn);
}

// Renders the current matrix state onto an offscreen canvas (sized to fit
// content, independent of on-screen CSS layout) and triggers a PNG download.
// Wraps a label into multiple lines that fit within maxWidth, preferring to
// break right after underscores (matching the HTML header behaviour). Falls
// back to a hard character break for any segment that's still too wide on
// its own (e.g. no underscores at all).
function wrapCanvasLabel(ctx, label, maxWidth) {
  const parts = label.split(/(?<=_)/);
  const lines = [];
  let cur = '';
  for (const part of parts) {
    const candidate = cur + part;
    if (cur && ctx.measureText(candidate).width > maxWidth) {
      lines.push(cur);
      cur = part;
    } else {
      cur = candidate;
    }
    while (ctx.measureText(cur).width > maxWidth && cur.length > 1) {
      let i = cur.length - 1;
      while (i > 1 && ctx.measureText(cur.slice(0, i)).width > maxWidth) i--;
      lines.push(cur.slice(0, i));
      cur = cur.slice(i);
    }
  }
  if (cur) lines.push(cur);
  return lines;
}

function downloadMatrixImage(btn) {
  const st = MATRIX_STATE;
  if (!st) return;

  const dpr = window.devicePixelRatio || 1;
  const rowLabelW = 190;
  const distColW = 90;
  const cellW = 118;
  const cellH = 26;
  const padding = 24;
  const colFont = '500 10px "JetBrains Mono", monospace';
  const lineH = 13;
  const headerInnerPad = { top: 10, bottom: 10 };

  // Wrap every column label up front so we know exactly how tall the
  // header needs to be — no clipping, no guesswork.
  const measure = document.createElement('canvas').getContext('2d');
  measure.font = colFont;
  const wrappedCols = st.sourceCols.map(c => wrapCanvasLabel(measure, c, cellW - 10));
  const maxLines = Math.max(1, ...wrappedCols.map(l => l.length));
  const headerH = maxLines * lineH + headerInnerPad.top + headerInnerPad.bottom;

  const nRows = st.rows.length + 1; // + average row
  const W = padding * 2 + rowLabelW + distColW + st.sourceCols.length * cellW;
  const H = padding * 2 + headerH + nRows * cellH + 20;

  const canvas = document.createElement('canvas');
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  // Background
  ctx.fillStyle = '#0c0e12';
  ctx.fillRect(0, 0, W, H);

  ctx.font = '700 13px "DM Sans", sans-serif';
  ctx.fillStyle = '#e2e4e9';
  ctx.textAlign = 'left';
  ctx.fillText('Admixture Comparison Matrix', padding, padding);

  const gridTop = padding + headerH;
  const gridLeft = padding + rowLabelW + distColW;

  // Column headers — horizontal, word-wrapped at underscore boundaries,
  // bottom-aligned so the last line of every label sits just above the grid.
  ctx.font = colFont;
  ctx.fillStyle = '#b8bcc6';
  ctx.textAlign = 'center';
  for (let ci = 0; ci < st.sourceCols.length; ci++) {
    const lines = wrappedCols[ci];
    const cx = gridLeft + ci * cellW + cellW / 2;
    const baseY = gridTop - headerInnerPad.bottom - (lines.length - 1) * lineH;
    for (let li = 0; li < lines.length; li++) {
      ctx.fillText(lines[li], cx, baseY + li * lineH);
    }
  }

  // "Target" / "Distance" headers
  ctx.font = '600 11px "JetBrains Mono", monospace';
  ctx.fillStyle = '#b8bcc6';
  ctx.textAlign = 'left';
  ctx.fillText('Target', padding, gridTop - 6);
  ctx.fillText('Distance', padding + rowLabelW, gridTop - 6);

  const allRows = [...st.rows.map(r => ({ ...r, isAvg: false })),
                    { label: 'Average', distance: st.avgDistance, values: st.avgValues, isAvg: true }];

  for (let ri = 0; ri < allRows.length; ri++) {
    const row = allRows[ri];
    const y = gridTop + ri * cellH;

    if (row.isAvg) {
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(padding, y); ctx.lineTo(W - padding, y); ctx.stroke();
    }

    // Row label
    ctx.font = row.isAvg ? '700 11px "JetBrains Mono", monospace' : '400 11px "JetBrains Mono", monospace';
    ctx.fillStyle = row.isAvg ? '#e2e4e9' : '#cfd2da';
    ctx.textAlign = 'left';
    ctx.fillText(row.label.length > 28 ? row.label.slice(0, 27) + '…' : row.label, padding, y + cellH / 2 + 4);

    // Distance
    ctx.font = '400 10px "JetBrains Mono", monospace';
    ctx.fillStyle = '#8a8f9c';
    ctx.fillText(isNaN(row.distance) ? 'N/A' : row.distance.toFixed(5), padding + rowLabelW, y + cellH / 2 + 4);

    // Cells
    for (let ci = 0; ci < row.values.length; ci++) {
      const v = row.values[ci];
      const x = gridLeft + ci * cellW;
      ctx.fillStyle = heatColor(v);
      ctx.fillRect(x, y + 2, cellW - 1, cellH - 3);

      ctx.font = '600 9.5px "JetBrains Mono", monospace';
      ctx.fillStyle = v > 25 ? '#0c0e12' : '#e2e4e9';
      ctx.textAlign = 'center';
      ctx.fillText(v.toFixed(1), x + cellW / 2, y + cellH / 2 + 4);
    }
  }

  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    const a = document.createElement('a');
    a.href = url;
    a.download = `g25_mcmc_matrix_${ts}.png`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    flashBtn(btn, 'Saved ✓');
  }, 'image/png');
}


// ═══════════════════════════════════════════════════════════════════════════
// MAIN RUNNER
// ═══════════════════════════════════════════════════════════════════════════

async function runAnalysis() {
  const btn = document.getElementById('run-btn');
  btn.disabled = true;
  btn.textContent = 'Running...';

  logEl.innerHTML = '';
  logEl.classList.add('visible');
  document.getElementById('results-section').innerHTML = '';
  document.getElementById('results-section').classList.remove('visible');

  const progressWrap = document.getElementById('progress-wrap');
  const progressFill = document.getElementById('progress-fill');
  progressWrap.style.display = '';

  // Read params
  const mode = document.getElementById('param-mode').value;
  const nIter = parseInt(document.getElementById('param-iter').value) || 50000;
  const burnin = parseInt(document.getElementById('param-burnin').value) || 10000;
  const thin = parseInt(document.getElementById('param-thin').value) || 10;
  const maxK = parseInt(document.getElementById('param-maxk').value) || 0;
  const nKeep = parseInt(document.getElementById('param-nkeep').value) || 25;
  const sigma = parseFloat(document.getElementById('param-sigma').value) || 0.01;
  const alpha = parseFloat(document.getElementById('param-alpha').value) || 1.0;
  const initConc = parseFloat(document.getElementById('param-conc').value) || 30;
  let sigmaMode = (document.getElementById('param-sigma-mode') || {}).value || 'empirical';
  const hetero = ((document.getElementById('param-hetero') || {}).value || 'false') === 'true';
  const sigmaPriorStrength = parseFloat((document.getElementById('param-prior') || {}).value) || 0;
  const seed = parseInt(document.getElementById('param-seed').value) || 42;

  rand = mulberry32(seed);

  const sourceText = document.getElementById('source-text').value;
  const targetText = document.getElementById('target-text').value;

  if (!sourceText.trim() || !targetText.trim()) {
    log('err', 'Error: Please provide both source and target data.');
    btn.disabled = false;
    btn.textContent = 'Run MCMC';
    progressWrap.style.display = 'none';
    return;
  }

  // ── Validate parameters ──
  if (burnin >= nIter) {
    log('err', `Error: Burn-in (${burnin}) must be less than total iterations (${nIter}). No samples would be saved.`);
    log('err', `  Tip: burn-in should typically be 10-20% of total iterations.`);
    btn.disabled = false;
    btn.textContent = 'Run MCMC';
    progressWrap.style.display = 'none';
    return;
  }

  const expectedSamples = Math.floor((nIter - burnin) / thin);
  if (expectedSamples < 10) {
    log('err', `Error: Only ${expectedSamples} posterior samples would be saved with current settings.`);
    log('err', `  Reduce burn-in, increase iterations, or decrease thinning.`);
    btn.disabled = false;
    btn.textContent = 'Run MCMC';
    progressWrap.style.display = 'none';
    return;
  }

  log('', `  Expected posterior samples: ${expectedSamples}`);

  log('header', '════════════════════════════════════════════════════');
  log('header', '  G25 Bayesian MCMC Admixture Estimator');
  log('header', '════════════════════════════════════════════════════');

  // Parse
  const src = parseG25(sourceText);
  const tgt = parseG25(targetText);

  if (src.coords.length === 0) { log('err', 'Error: no valid source rows parsed.'); btn.disabled = false; btn.textContent = 'Run MCMC'; return; }
  if (tgt.coords.length === 0) { log('err', 'Error: no valid target rows parsed.'); btn.disabled = false; btn.textContent = 'Run MCMC'; return; }

  // Debug: report any parsing warnings
  if (src.debugWarnings && src.debugWarnings.length > 0) {
    log('warn', `⚠ Source data parsing warnings (${src.debugWarnings.length}):`);
    for (const w of src.debugWarnings) log('warn', w);
  }
  if (tgt.debugWarnings && tgt.debugWarnings.length > 0) {
    log('warn', `⚠ Target data parsing warnings (${tgt.debugWarnings.length}):`);
    for (const w of tgt.debugWarnings) log('warn', w);
  }
  
  // Debug: check dimension consistency
  const srcDims = new Set(src.coords.map(c => c.length));
  const tgtDims = new Set(tgt.coords.map(c => c.length));
  if (srcDims.size > 1) {
    log('warn', `⚠ Source data has inconsistent dimensions: ${[...srcDims].join(', ')} — this may cause errors.`);
  }
  if (tgtDims.size > 1) {
    log('warn', `⚠ Target data has inconsistent dimensions: ${[...tgtDims].join(', ')}`);
  }
  const srcDim = src.coords[0].length;
  const tgtDim = tgt.coords[0].length;
  if (srcDim !== tgtDim) {
    log('err', `Error: Source dimensions (${srcDim}) ≠ Target dimensions (${tgtDim}). Data must have same number of G25 coordinates.`);
    btn.disabled = false; btn.textContent = 'Run MCMC';
    progressWrap.style.display = 'none';
    return;
  }

  log('', `Loaded ${src.coords.length} source samples, ${new Set(src.populations).size} populations`);
  log('', `Loaded ${tgt.coords.length} target(s)`);
  log('', `Dimensions: ${src.coords[0].length}`);

  // Aggregate if population mode
  let sourceLabels, sourceCoords, sourceNsamples;
  if (mode === 'population') {
    log('', 'Mode: POPULATION (averaging within each population)');
    const popNames = [...new Set(src.populations)];
    sourceLabels = popNames;
    sourceNsamples = [];
    sourceCoords = popNames.map(p => {
      const idxs = src.populations.map((pp, i) => pp === p ? i : -1).filter(i => i >= 0);
      sourceNsamples.push(idxs.length);
      const D = src.coords[0].length;
      const avg = new Array(D).fill(0);
      for (const i of idxs) for (let d = 0; d < D; d++) avg[d] += src.coords[i][d];
      return avg.map(v => v / idxs.length);
    });
  } else {
    log('', 'Mode: SAMPLE (each sample individually)');
    sourceLabels = src.labels;
    sourceCoords = src.coords;
    sourceNsamples = src.coords.map(() => 1);
  }

  log('', `Source matrix: ${sourceCoords.length} sources x ${sourceCoords[0].length} dimensions`);

  // ── Empirical noise floor (Phase 1) and sigma-mode resolution ──
  log('', 'Estimating empirical noise floor from source panel...');
  const noiseFloor = estimateNoiseFloor(src.coords, src.populations);
  if (!['empirical','fixed','bayes'].includes(sigmaMode)) sigmaMode = 'empirical';
  const floorOk = isFinite(noiseFloor.sigmaScalar) && noiseFloor.nMulti >= 5 && noiseFloor.df >= 30;
  if (sigmaMode === 'empirical' || sigmaMode === 'bayes') {
    if (floorOk) {
      log('', `Sigma mode: ${sigmaMode.toUpperCase()}${hetero ? ' (per-dimension)' : ''}. Noise floor sigma_indiv = ${noiseFloor.sigmaScalar.toFixed(5)} (from ${noiseFloor.nMulti} multi-sample populations, df=${noiseFloor.df})`);
    } else {
      log('warn', `Sigma mode: ${sigmaMode.toUpperCase()} requested, but only ${noiseFloor.nMulti} multi-sample populations (df=${noiseFloor.df}). Falling back to FIXED sigma = ${sigma}.`);
      sigmaMode = 'fixed';
    }
  } else {
    log('', `Sigma mode: FIXED. sigma = ${sigma}`);
  }

  // Yield to UI
  await new Promise(r => setTimeout(r, 50));

  const resultsSection = document.getElementById('results-section');
  resultsSection.innerHTML = '<div class="results-header">Results</div>';
  resultsSection.classList.add('visible');

  const allTargetSummaries = [];

  for (let tIdx = 0; tIdx < tgt.coords.length; tIdx++) {
    const targetVec = tgt.coords[tIdx];
    const targetLabel = tgt.labels[tIdx];

    log('header', `\n──── Target: ${targetLabel} ────`);

    const targetStartTime = performance.now();

    // Step 1: Pre-selection
    log('step', '\nStep 1: Pre-selecting candidate sources...');
    await new Promise(r => setTimeout(r, 20));
    const t1Start = performance.now();
    const presel = preselectSources(targetVec, sourceCoords, sourceLabels, nKeep, log);
    log('', `  [timing] Pre-selection: ${(performance.now() - t1Start).toFixed(0)} ms`);
    let selCoords = presel.indices.map(i => sourceCoords[i]);
    let selNames = presel.indices.map(i => sourceLabels[i]);

    // ── Resolve sigma for THIS target ──
    const mTarget = 1;
    let sigmaBase;
    if (sigmaMode === 'empirical' || sigmaMode === 'bayes') {
      const nCand = presel.indices.map(i => sourceNsamples[i]);
      const factor = propagationFactor(presel.initialWeights, nCand, mTarget);
      sigmaBase = hetero ? noiseFloor.sigmaD.map(s => s * factor)
                         : noiseFloor.sigmaScalar * factor;
      log('', `  Sigma (${sigmaMode}${hetero ? ', per-dim' : ''}, propagated): ${rmsOf(sigmaBase).toFixed(5)} [m_target=${mTarget}]`);
    } else {
      sigmaBase = sigma;
      log('', `  Sigma (fixed): ${sigma}`);
    }
    const sigmaScalarForChecks = rmsOf(sigmaBase);

    // Step 2: Forward selection (uses the base noise level)
    log('step', '\nStep 2: Forward stepwise model selection...');
    await new Promise(r => setTimeout(r, 20));
    const t2Start = performance.now();
    const effectiveMaxK = maxK > 0 ? maxK : Math.min(12, selCoords.length);
    const effectiveMinK = maxK > 0 ? maxK : 2;
    const fwd = forwardSelect(targetVec, selCoords, selNames, sigmaBase, effectiveMaxK, effectiveMinK, log);
    log('', `  [timing] Forward selection: ${(performance.now() - t2Start).toFixed(0)} ms`);
    selCoords = fwd.indices.map(i => selCoords[i]);
    selNames = fwd.indices.map(i => selNames[i]);

    // Identifiability check on the final source set (scalar sigma summary)
    checkNearDuplicates(selCoords, selNames, sigmaScalarForChecks, log);

    // Step 3: MCMC
    log('step', '\nStep 3: Running Bayesian MCMC...');
    await new Promise(r => setTimeout(r, 20));
    const t3Start = performance.now();

    const mcmcResult = await new Promise(resolve => {
      setTimeout(() => {
        const result = runMCMC(targetVec, selCoords, selNames, nIter, burnin, thin, sigmaBase, alpha, initConc, log, pct => {
          progressFill.style.width = pct + '%';
        }, sigmaMode === 'bayes', sigmaPriorStrength);
        resolve(result);
      }, 50);
    });
    log('', `  [timing] MCMC: ${(performance.now() - t3Start).toFixed(0)} ms`);

    // Step 4: Summarise
    log('step', '\nStep 4: Summarising posteriors...');
    const summary = summarisePosterior(mcmcResult.chain, selNames);
    log('ok', `  [timing] TOTAL for this target: ${(performance.now() - targetStartTime).toFixed(0)} ms`);

    // Fit quality
    let rmse = NaN;
    if (mcmcResult.chain.length > 0) {
      const wMean = new Array(selNames.length).fill(0);
      for (const row of mcmcResult.chain) for (let k = 0; k < row.length; k++) wMean[k] += row[k];
      for (let k = 0; k < wMean.length; k++) wMean[k] /= mcmcResult.chain.length;
      const pred = weightedSum(wMean, selCoords);
      const resid = vecSub(targetVec, pred);
      rmse = Math.sqrt(dot(resid, resid) / targetVec.length);
    } else {
      log('err', '  ⚠ Chain is empty — no posterior samples were saved!');
      log('err', '    This happens when burn-in >= iterations. Reduce burn-in or increase iterations.');
    }

    // Print results to log
    log('ok', '\n┌─────────────────────────────────────────────────┐');
    log('ok', `│  RESULTS: ${targetLabel}`);
    log('ok', '├─────────────────────────────────────────────────┤');
    for (const s of summary) {
      const sig = s.significant ? ' ***' : '';
      log('', `│  ${s.source.padEnd(35)} ${s.pctMean.toFixed(1).padStart(5)}%  [${s.pctCILo.toFixed(1)}% - ${s.pctCIHi.toFixed(1)}%]${sig}`);
    }
    log('ok', '└─────────────────────────────────────────────────┘');
    log('', `  *** = 95% CI excludes zero`);
    log('', `  Fit RMSE: ${isNaN(rmse) ? 'N/A (empty chain)' : rmse.toFixed(6)}`);

    allTargetSummaries.push({
      label: targetLabel,
      distance: rmse,
      sources: summary.map(s => ({ name: s.source, pct: s.pctMean }))
    });

    // Diagnostics
    const active = summary.filter(s => s.pctMean > 1);
    const diagData = active.map(s => {
      const idx = selNames.indexOf(s.source);
      const vals = mcmcResult.chain.map(row => row[idx]);
      return {
        name: s.source,
        ess: effectiveSampleSize(vals),
        geweke: gewekeZ(vals)
      };
    });

    // Build this target's results HTML block
    const blockId = `result-${tIdx}`;
    const canvasBarId = `bar-${tIdx}`;
    const canvasLogPostId = `logpost-${tIdx}`;

    let blockHTML = `<div class="result-block" id="${blockId}">`;
    blockHTML += `<h3>Target: ${escHtml(targetLabel)}</h3>`;

    // Summary table
    blockHTML += `<div class="data-table-wrap"><table class="data-table">
      <thead><tr><th>Source</th><th>Mean %</th><th>Median %</th><th>SD</th><th>95% CI Low</th><th>95% CI High</th><th>Signal</th></tr></thead><tbody>`;
    for (const s of summary) {
      const sigCls = s.significant ? 'sig-yes' : 'sig-no';
      const sigTxt = s.significant ? '✓ sig' : 'n.s.';
      const fmt = (v) => isNaN(v) ? 'N/A' : v.toFixed(2) + '%';
      const fmtSD = (v) => isNaN(v) ? 'N/A' : v.toFixed(3);
      blockHTML += `<tr><td>${escHtml(s.source)}</td><td>${fmt(s.pctMean)}</td><td>${fmt(s.median*100)}</td><td>${fmtSD(s.sd*100)}</td><td>${fmt(s.pctCILo)}</td><td>${fmt(s.pctCIHi)}</td><td class="${sigCls}">${sigTxt}</td></tr>`;
    }
    blockHTML += `</tbody></table></div>`;

    // Fit info
    const rmseDisplay = isNaN(rmse) ? 'N/A' : rmse.toFixed(6);
    const rmseClass = isNaN(rmse) ? 'bad' : (rmse < 0.01 ? 'good' : rmse < 0.02 ? 'warn' : 'bad');
    blockHTML += `<div class="diag-grid">
      <div class="diag-card"><div class="label">Fit RMSE</div><div class="value ${rmseClass}">${rmseDisplay}</div></div>
      <div class="diag-card"><div class="label">Accept Rate</div><div class="value ${mcmcResult.acceptanceRate >= 0.2 && mcmcResult.acceptanceRate <= 0.5 ? 'good' : 'warn'}">${mcmcResult.acceptanceRate.toFixed(3)}</div></div>
      <div class="diag-card"><div class="label">Chain Length</div><div class="value ${mcmcResult.chain.length === 0 ? 'bad' : ''}">${mcmcResult.chain.length}</div></div>
      <div class="diag-card"><div class="label">Sources Selected</div><div class="value">${selNames.length}</div></div>
      ${mcmcResult.sigmaPosterior ? `<div class="diag-card"><div class="label">Posterior &sigma;</div><div class="value">${mcmcResult.sigmaPosterior.mean.toFixed(4)}<div style="font-size:0.6rem;color:var(--text3);margin-top:2px;">[${mcmcResult.sigmaPosterior.ciLo.toFixed(4)} – ${mcmcResult.sigmaPosterior.ciHi.toFixed(4)}]</div></div></div>` : ''}
    </div>`;

    // Bar chart
    blockHTML += `<div class="chart-container"><h4>Admixture Composition</h4><canvas id="${canvasBarId}" style="width:100%;height:${Math.max(200, summary.filter(s=>s.pctMean>0.3).length * 50)}px"></canvas></div>`;

    // Density plots
    const activeForPlots = summary.filter(s => s.pctMean > 0.5);
    blockHTML += `<div class="chart-row">`;
    for (let i = 0; i < activeForPlots.length; i++) {
      blockHTML += `<div class="chart-container"><h4>Posterior Density</h4><canvas id="density-${tIdx}-${i}" style="width:100%;height:220px"></canvas></div>`;
    }
    blockHTML += `</div>`;

    // Trace plots
    blockHTML += `<div class="chart-row">`;
    for (let i = 0; i < Math.min(activeForPlots.length, 8); i++) {
      blockHTML += `<div class="chart-container"><h4>Trace Plot</h4><canvas id="trace-${tIdx}-${i}" style="width:100%;height:160px"></canvas></div>`;
    }
    blockHTML += `</div>`;

    // Log-posterior trace
    blockHTML += `<div class="chart-container"><h4>Log-Posterior Trace</h4><canvas id="${canvasLogPostId}" style="width:100%;height:220px"></canvas></div>`;

    // Diagnostics table
    if (diagData.length > 0) {
      blockHTML += `<div class="chart-container"><h4>Convergence Diagnostics</h4><div class="data-table-wrap"><table class="data-table">
        <thead><tr><th>Source</th><th>ESS</th><th>Geweke z</th><th>Status</th></tr></thead><tbody>`;
      for (const d of diagData) {
        const essClass = d.ess >= 200 ? 'good' : d.ess >= 100 ? 'warn' : 'bad';
        const zOk = Math.abs(d.geweke) < 2;
        blockHTML += `<tr><td>${escHtml(d.name)}</td><td class="diag-card"><span class="value ${essClass}" style="font-size:0.85rem">${d.ess}</span></td><td>${d.geweke.toFixed(3)}</td><td class="${zOk ? 'sig-yes' : 'sig-no'}">${zOk ? 'OK' : '!! CHECK'}</td></tr>`;
      }
      blockHTML += `</tbody></table></div></div>`;
    }

    blockHTML += `</div>`;

    // Append this target's block to the DOM (preserving previous targets' drawn canvases)
    resultsSection.insertAdjacentHTML('beforeend', blockHTML);

    // Draw canvases after DOM update
    await new Promise(r => setTimeout(r, 50));

    drawBarChart(document.getElementById(canvasBarId), summary, targetLabel);
    drawLogPosteriorTrace(document.getElementById(canvasLogPostId), mcmcResult.logPostTrace, burnin);

    for (let i = 0; i < activeForPlots.length; i++) {
      const idx = selNames.indexOf(activeForPlots[i].source);
      const canvas = document.getElementById(`density-${tIdx}-${i}`);
      if (canvas) drawDensityPlot(canvas, mcmcResult.chain, idx, activeForPlots[i].source, CHART_COLORS[i % CHART_COLORS.length]);
    }

    for (let i = 0; i < Math.min(activeForPlots.length, 8); i++) {
      const idx = selNames.indexOf(activeForPlots[i].source);
      const canvas = document.getElementById(`trace-${tIdx}-${i}`);
      if (canvas) drawTracePlot(canvas, mcmcResult.chain, idx, activeForPlots[i].source, CHART_COLORS[i % CHART_COLORS.length]);
    }
  }

  if (allTargetSummaries.length > 1) {
    renderMatrixSection(allTargetSummaries);
  }

  progressWrap.style.display = 'none';
  btn.disabled = false;
  btn.textContent = 'Run MCMC';
  log('ok', '\n════════════════════════════════════════════════════');
  log('ok', '  Analysis complete!');
  log('ok', '════════════════════════════════════════════════════');
}
</script>

</body>
</html>
