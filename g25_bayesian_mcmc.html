<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G25 Bayesian MCMC Admixture Estimator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=DM+Sans:wght@300;400;500;600;700&family=Fraunces:wght@400;600;700;900&display=swap');

:root {
  --bg: #0c0e12;
  --bg2: #13161c;
  --bg3: #1a1e26;
  --bg4: #222730;
  --surface: #1e222b;
  --border: #2a2f3a;
  --border2: #353b48;
  --text: #e2e4e9;
  --text2: #9ca0ab;
  --text3: #6b7080;
  --accent: #5b8af5;
  --accent2: #3d6de0;
  --accent-glow: rgba(91,138,245,0.15);
  --green: #4ade80;
  --red: #f87171;
  --orange: #fb923c;
  --yellow: #fbbf24;
  --purple: #a78bfa;
  --cyan: #22d3ee;
  --pink: #f472b6;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  line-height: 1.6;
  min-height: 100vh;
}

.app-header {
  padding: 2rem 2rem 1rem;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, var(--bg2) 0%, var(--bg) 100%);
}

.app-header h1 {
  font-family: 'Fraunces', serif;
  font-weight: 700;
  font-size: 1.75rem;
  letter-spacing: -0.03em;
  background: linear-gradient(135deg, var(--text) 0%, var(--accent) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.app-header p {
  color: var(--text3);
  font-size: 0.85rem;
  margin-top: 0.25rem;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 300;
}

.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 1.5rem 2rem 4rem;
}

/* ── Input Section ── */
.input-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.25rem;
  margin-bottom: 1.25rem;
}

@media (max-width: 900px) {
  .input-grid { grid-template-columns: 1fr; }
}

.input-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1.25rem;
}

.input-card h3 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--accent);
  margin-bottom: 0.75rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.input-card h3 .dot {
  width: 6px; height: 6px;
  background: var(--accent);
  border-radius: 50%;
  display: inline-block;
}

.tab-row {
  display: flex;
  gap: 0;
  margin-bottom: 0.75rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}

.tab-btn {
  flex: 1;
  padding: 0.4rem 0.75rem;
  font-size: 0.75rem;
  font-family: 'JetBrains Mono', monospace;
  background: var(--bg3);
  color: var(--text3);
  border: none;
  cursor: pointer;
  transition: all 0.2s;
}

.tab-btn.active {
  background: var(--accent2);
  color: white;
}

.tab-btn:hover:not(.active) {
  background: var(--bg4);
  color: var(--text2);
}

textarea {
  width: 100%;
  min-height: 160px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem;
  line-height: 1.5;
  padding: 0.75rem;
  resize: vertical;
  outline: none;
  transition: border-color 0.2s;
}

textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-glow);
}

textarea::placeholder { color: var(--text3); }

.file-drop {
  border: 2px dashed var(--border);
  border-radius: 8px;
  padding: 1.5rem;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg);
  color: var(--text3);
  font-size: 0.8rem;
  position: relative;
}

.file-drop:hover, .file-drop.dragover {
  border-color: var(--accent);
  background: var(--accent-glow);
  color: var(--text2);
}

.file-drop input[type=file] {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}

.file-drop .loaded {
  color: var(--green);
  font-weight: 500;
}

/* ── Parameters ── */
.params-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  margin-bottom: 1.25rem;
  align-items: end;
}

.param-group {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.param-group label {
  font-size: 0.65rem;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* ── Info tooltips ── */
.info {
  position: relative;
  display: inline-block;
  cursor: help;
  color: #6b7cff;
  font-size: 0.72rem;
  margin-left: 3px;
  text-transform: none;
  vertical-align: middle;
  outline: none;
}
.info .tip {
  visibility: hidden;
  opacity: 0;
  transition: opacity 0.12s ease;
  position: absolute;
  left: 0;
  top: 150%;
  z-index: 60;
  width: 250px;
  background: #12182a;
  border: 1px solid #2b3550;
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 0.72rem;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  line-height: 1.5;
  letter-spacing: normal;
  text-transform: none;
  color: #b9c1d4;
  font-weight: 400;
  box-shadow: 0 10px 28px rgba(0,0,0,0.5);
  white-space: normal;
  pointer-events: none;
}
.info:hover .tip,
.info:focus .tip { visibility: visible; opacity: 1; }
.info .tip b { color: #eef1f8; font-weight: 600; }
.info .tip .tech {
  display: block;
  margin-top: 7px;
  color: #79839c;
  font-size: 0.68rem;
}
/* keep the last few tooltips from clipping off the right edge */
.params-row .param-group:nth-last-child(-n+4) .info .tip { left: auto; right: 0; }

.param-group input[type=number],
.param-group select {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.78rem;
  padding: 0.4rem 0.5rem;
  width: 100px;
  outline: none;
}

.param-group input:focus, .param-group select:focus {
  border-color: var(--accent);
}

.param-group select { width: 130px; }

.run-btn {
  background: var(--accent2);
  color: white;
  border: none;
  border-radius: 8px;
  padding: 0.6rem 2rem;
  font-family: 'DM Sans', sans-serif;
  font-weight: 600;
  font-size: 0.9rem;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.02em;
}

.run-btn:hover:not(:disabled) {
  background: var(--accent);
  transform: translateY(-1px);
  box-shadow: 0 4px 20px var(--accent-glow);
}

.run-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* ── Log ── */
#log-panel {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1rem 1.25rem;
  margin-bottom: 1.5rem;
  max-height: 300px;
  overflow-y: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  line-height: 1.7;
  color: var(--text2);
  display: none;
}

#log-panel.visible { display: block; }

.log-header { color: var(--accent); font-weight: 600; }
.log-step { color: var(--yellow); }
.log-ok { color: var(--green); }
.log-warn { color: var(--orange); }
.log-err { color: var(--red); }

/* Per-iteration "Iter N/M | Accept: ... | Conc: ..." lines — instantly
   hidden/shown by the "Show iteration details" checkbox, regardless of
   whether they were logged before or after it was toggled. */
#log-panel.hide-iter .log-iter { display: none; }

/* ── Log toolbar ── */
.log-toolbar {
  display: none;
  align-items: center;
  gap: 1.25rem;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-bottom: none;
  border-radius: 10px 10px 0 0;
  padding: 0.6rem 1.25rem;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem;
  color: var(--text2);
}

.log-toolbar.visible { display: flex; }

.log-toolbar-check {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  cursor: pointer;
  user-select: none;
}

.log-toolbar-check input { accent-color: var(--accent); cursor: pointer; }

.log-toolbar-spacer { flex: 1; }

.log-toolbar-btn {
  background: var(--bg3);
  border: 1px solid var(--border2);
  color: var(--text2);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem;
  padding: 0.35rem 0.7rem;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s;
}

.log-toolbar-btn:hover {
  background: var(--bg4);
  color: var(--text);
  border-color: var(--accent);
}

#log-panel.with-toolbar { border-radius: 0 0 10px 10px; margin-top: 0; }

/* ── Results ── */
#results-section { display: none; }
#results-section.visible { display: block; }

.results-header {
  font-family: 'Fraunces', serif;
  font-size: 1.4rem;
  font-weight: 700;
  margin-bottom: 1.25rem;
  padding-bottom: 0.75rem;
  border-bottom: 1px solid var(--border);
}

.result-block {
  margin-bottom: 2.5rem;
}

.result-block h3 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--text2);
  margin-bottom: 1rem;
  padding: 0.5rem 0.75rem;
  background: var(--bg2);
  border-radius: 6px;
  border-left: 3px solid var(--accent);
}

/* ── Tables ── */
.data-table-wrap {
  overflow-x: auto;
  margin-bottom: 1.5rem;
  border-radius: 8px;
  border: 1px solid var(--border);
}

table.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.78rem;
}

table.data-table th {
  background: var(--bg3);
  color: var(--text2);
  font-family: 'JetBrains Mono', monospace;
  font-weight: 500;
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 0.6rem 0.75rem;
  text-align: left;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
}

table.data-table td {
  padding: 0.5rem 0.75rem;
  border-bottom: 1px solid var(--border);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
}

table.data-table tr:last-child td { border-bottom: none; }

table.data-table tr:hover td { background: var(--bg3); }

.sig-yes { color: var(--green); font-weight: 600; }
.sig-no { color: var(--text3); }

/* ── Comparison Matrix ── */
.matrix-section {
  margin-top: 1rem;
  margin-bottom: 2.5rem;
}

.matrix-help {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.72rem;
  line-height: 1.6;
  color: var(--text3);
  margin: -0.5rem 0 1.1rem;
  max-width: 800px;
}

.matrix-help b { color: var(--text2); font-weight: 600; }

.matrix-toolbar {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  flex-wrap: wrap;
  margin-bottom: 1rem;
}

.matrix-toolbar .spacer { flex: 1; }

.matrix-btn {
  background: var(--bg3);
  border: 1px solid var(--border2);
  color: var(--text2);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem;
  padding: 0.45rem 0.85rem;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s;
}

.matrix-btn:hover {
  background: var(--bg4);
  color: var(--text);
  border-color: var(--accent);
}

.matrix-wrap {
  overflow-x: auto;
  overflow-y: visible;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: #2a2e38;
}

table.matrix-table {
  border-collapse: collapse;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem;
  color: #e2e4e9;
}

table.matrix-table th, table.matrix-table td {
  padding: 0.4rem 0.55rem;
  text-align: center;
  white-space: nowrap;
  border: 1px solid rgba(255,255,255,0.05);
}

table.matrix-table th.matrix-rowhead, table.matrix-table td.matrix-rowhead {
  text-align: left;
  position: sticky;
  left: 0;
  background: #2a2e38;
  z-index: 2;
}

table.matrix-table th.matrix-dist, table.matrix-table td.matrix-dist {
  color: var(--text3);
  position: sticky;
  left: 132px;
  background: #2a2e38;
  z-index: 2;
}

table.matrix-table thead th {
  cursor: pointer;
  user-select: none;
  font-weight: 500;
  color: #b8bcc6;
  vertical-align: bottom;
}

table.matrix-table thead th.matrix-rowhead,
table.matrix-table thead th.matrix-dist {
  padding-bottom: 0.5rem;
}

table.matrix-table thead th.matrix-colname,
table.matrix-table tbody td.matrix-colcell {
  width: 118px;
  min-width: 118px;
  max-width: 118px;
}

table.matrix-table thead th.matrix-colname {
  white-space: normal;
  overflow-wrap: break-word;
  word-break: break-word;
  text-align: center;
  padding: 0.5rem 0.4rem 0.6rem;
  line-height: 1.35;
}

table.matrix-table thead th:hover { color: #fff; }

table.matrix-table thead th.sorted-col { color: var(--accent); }

table.matrix-table tbody tr.matrix-avg-row td {
  border-top: 2px solid rgba(255,255,255,0.2);
  font-weight: 600;
  color: #cfd2da;
}

table.matrix-table tbody tr:hover td:not(.matrix-rowhead):not(.matrix-dist) { outline: 1px solid rgba(255,255,255,0.25); outline-offset: -1px; }


/* ── Charts ── */
.chart-container {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1.25rem;
  margin-bottom: 1.25rem;
}

.chart-container h4 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text3);
  margin-bottom: 1rem;
}

canvas { max-width: 100%; }

.chart-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.25rem;
}

@media (max-width: 900px) {
  .chart-row { grid-template-columns: 1fr; }
}

/* ── Diagnostics ── */
.diag-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1rem;
  margin-bottom: 1.25rem;
}

.diag-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1rem;
}

.diag-card .label {
  font-size: 0.65rem;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 0.25rem;
}

.diag-card .value {
  font-size: 1.4rem;
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
}

.diag-card .value.good { color: var(--green); }
.diag-card .value.warn { color: var(--orange); }
.diag-card .value.bad { color: var(--red); }

/* ── Progress ── */
.progress-bar-wrap {
  width: 100%;
  height: 4px;
  background: var(--bg3);
  border-radius: 2px;
  margin: 0.5rem 0;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent2), var(--accent));
  border-radius: 2px;
  transition: width 0.3s;
  width: 0%;
}

/* scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text3); }
</style>
</head>
<body>

<div class="app-header">
  <h1>G25 Bayesian MCMC Admixture Estimator</h1>
  <p>posterior distributions over ancestry proportions via Metropolis-Hastings &middot; no server required</p>
</div>

<div class="container">

  <!-- ═══ Input Section ═══ -->
  <div class="input-grid">
    <div class="input-card">
      <h3><span class="dot"></span> Source Populations</h3>
      <div class="tab-row">
        <button class="tab-btn active" onclick="switchTab('source','paste',this)">Paste</button>
        <button class="tab-btn" onclick="switchTab('source','upload',this)">Upload CSV</button>
      </div>
      <div id="source-paste">
        <textarea id="source-text" placeholder="Pop1:Sample1, 0.123, -0.045, 0.067, ...&#10;Pop1:Sample2, 0.125, -0.043, 0.069, ...&#10;Pop2:Sample1, 0.200, 0.010, -0.030, ...&#10;&#10;One row per sample. Column 1 = Population:SampleName, Columns 2-26 = G25 coords."></textarea>
      </div>
      <div id="source-upload" style="display:none">
        <div class="file-drop" id="source-drop">
          <span id="source-drop-label">Drop CSV here or click to browse</span>
          <input type="file" accept=".csv,.txt" onchange="handleFile(this,'source')">
        </div>
      </div>
    </div>

    <div class="input-card">
      <h3><span class="dot"></span> Target Individual(s)</h3>
      <div class="tab-row">
        <button class="tab-btn active" onclick="switchTab('target','paste',this)">Paste</button>
        <button class="tab-btn" onclick="switchTab('target','upload',this)">Upload CSV</button>
      </div>
      <div id="target-paste">
        <textarea id="target-text" placeholder="MyAncestry:Me, 0.150, -0.020, 0.045, ...&#10;&#10;One row per target. Same format as sources."></textarea>
      </div>
      <div id="target-upload" style="display:none">
        <div class="file-drop" id="target-drop">
          <span id="target-drop-label">Drop CSV here or click to browse</span>
          <input type="file" accept=".csv,.txt" onchange="handleFile(this,'target')">
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ Parameters ═══ -->
  <div class="params-row">
    <div class="param-group">
      <label>Mode <span class="info" tabindex="0">ⓘ<span class="tip"><b>How sources are built.</b> Population averages each population into one point (standard, faster). Sample treats every individual as its own source.<span class="tech">Population mode uses the per-population mean coordinate.</span></span></span></label>
      <select id="param-mode">
        <option value="population">Population</option>
        <option value="sample">Sample</option>
      </select>
    </div>
    <div class="param-group">
      <label>Iterations <span class="info" tabindex="0">ⓘ<span class="tip"><b>How many steps the sampler takes.</b> More steps means a smoother, more reliable estimate but a longer run. 50,000 is fine for a quick look; 200,000+ for final results.<span class="tech">Total Metropolis-Hastings iterations before thinning.</span></span></span></label>
      <input type="number" id="param-iter" value="50000" min="1000" step="1000">
    </div>
    <div class="param-group">
      <label>Burn-in <span class="info" tabindex="0">ⓘ<span class="tip"><b>Early steps to discard.</b> The sampler needs a moment to find its footing; those first steps aren't representative yet. Keep it around 10-20% of Iterations.<span class="tech">Warm-up iterations dropped before sampling; also lets the step-size auto-tune.</span></span></span></label>
      <input type="number" id="param-burnin" value="10000" min="100" step="1000">
    </div>
    <div class="param-group">
      <label>Thin <span class="info" tabindex="0">ⓘ<span class="tip"><b>Keep every Nth step.</b> Neighbouring steps are similar, so keeping one in ten trims the saved data without losing much. 10 is a good default.<span class="tech">Thinning interval applied after burn-in.</span></span></span></label>
      <input type="number" id="param-thin" value="10" min="1">
    </div>
    <div class="param-group">
      <label>Max K <span class="info" tabindex="0">ⓘ<span class="tip"><b>Force a set number of sources.</b> Leave at 0 to let the tool choose. Set to 1 to allow a single-source answer; set higher to force that many.<span class="tech">0 = auto via BIC with a floor of 2 sources; any value >0 fixes K.</span></span></span></label>
      <input type="number" id="param-maxk" value="0" min="0" max="20">
    </div>
    <div class="param-group">
      <label>Pre-select N <span class="info" tabindex="0">ⓘ<span class="tip"><b>Size of the candidate shortlist.</b> How many sources to consider in detail out of your whole panel. Higher casts a wider net (slower); lower is faster but may miss a distinct source. 25-250 is typical.<span class="tech">Candidates kept after multi-strategy pre-selection (distance, NNLS, residual-chase, direction).</span></span></span></label>
      <input type="number" id="param-nkeep" value="25" min="2" max="100">
    </div>
    <div class="param-group">
      <label>Sigma mode <span class="info" tabindex="0">ⓘ<span class="tip"><b>How the noise level is chosen.</b> Empirical measures it from your panel's own sample scatter (recommended). Fixed uses the Sigma box. Bayes measures it and then samples it too, so the intervals honestly widen to reflect that you didn't know it exactly.<span class="tech">Empirical = pooled within-population SD, propagated per target; bayes adds a Gibbs step with an Inverse-Gamma prior anchored to that floor.</span></span></span></label>
      <select id="param-sigma-mode">
        <option value="empirical">Empirical</option>
        <option value="fixed">Fixed</option>
        <option value="bayes">Bayes</option>
      </select>
    </div>
    <div class="param-group">
      <label>Sigma <span class="info" tabindex="0">ⓘ<span class="tip"><b>Assumed noise level.</b> Only used when Sigma mode is Fixed. Smaller finds more components but risks fitting noise; larger is more conservative.<span class="tech">Gaussian likelihood standard deviation per G25 dimension.</span></span></span></label>
      <input type="number" id="param-sigma" value="0.01" min="0.0001" step="0.001">
    </div>
    <div class="param-group">
      <label>Per-dim noise <span class="info" tabindex="0">ⓘ<span class="tip"><b>One noise level, or one per coordinate.</b> Off uses a single level for all 25 axes. On measures a separate level per axis so noisier axes count for less. Only changes results when the axes truly differ.<span class="tech">Heteroscedastic per-dimension sigma in the likelihood and BIC.</span></span></span></label>
      <select id="param-hetero">
        <option value="false">Off</option>
        <option value="true">On</option>
      </select>
    </div>
    <div class="param-group">
      <label>Sigma prior <span class="info" tabindex="0">ⓘ<span class="tip"><b>Bayes mode only.</b> How firmly the sampled noise level is held to the measured floor. 0 uses a sensible default (the number of coordinates). Higher pins it to the floor; lower lets your target's own fit move it.<span class="tech">Pseudo-count of the Inverse-Gamma prior on the noise scale.</span></span></span></label>
      <input type="number" id="param-prior" value="0" min="0" step="1">
    </div>
    <div class="param-group">
      <label>Alpha <span class="info" tabindex="0">ⓘ<span class="tip"><b>Preference for sparse answers.</b> 1.0 is neutral. Below 1 favours mixtures where a few sources carry most of the weight, suppressing tiny noise-level components.<span class="tech">Dirichlet prior concentration on the weights.</span></span></span></label>
      <input type="number" id="param-alpha" value="1.0" min="0.01" step="0.1">
    </div>
    <div class="param-group">
      <label>Proposal conc. <span class="info" tabindex="0">ⓘ<span class="tip"><b>Sampler step size.</b> Auto-tuned during burn-in, so you rarely touch it. Raise it if the acceptance rate comes out too low; lower it if too high. 30 is a good start.<span class="tech">Dirichlet proposal concentration; higher = smaller, more cautious steps.</span></span></span></label>
      <input type="number" id="param-conc" value="30" min="2" max="5000" step="1">
    </div>
    <div class="param-group">
      <label>Seed <span class="info" tabindex="0">ⓘ<span class="tip"><b>Reproducibility control.</b> Fixes the random stream so a run repeats exactly. Change it to check that a result holds up across different random starts.<span class="tech">PRNG seed (mulberry32).</span></span></span></label>
      <input type="number" id="param-seed" value="42" min="1">
    </div>
    <div class="param-group" style="align-self:end">
      <button class="run-btn" id="run-btn" onclick="runAnalysis()">Run MCMC</button>
    </div>
  </div>

  <div class="progress-bar-wrap" id="progress-wrap" style="display:none">
    <div class="progress-bar-fill" id="progress-fill"></div>
  </div>

  <!-- ═══ Log ═══ -->
  <div class="log-toolbar" id="log-toolbar">

    <button class="log-toolbar-btn" onclick="saveLog(this)">Save Log</button>
